<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>LeetCode 4: Binary Search Partition Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #1e1e1e; color: #d4d4d4; font-family: 'JetBrains Mono', monospace; height: 100vh; overflow: hidden; }
        .vscode-bg-side { background-color: #252526; }
        .vscode-border { border-color: #3e3e42; }
        .line-highlight { background-color: rgba(38, 79, 120, 0.3); border-left: 3px solid #007acc; }
        .vscode-accent { color: #569cd6; }
        .vscode-keyword { color: #c586c0; }
        .vscode-func { color: #dcdcaa; }
        .vscode-string { color: #ce9178; }
        .vscode-num { color: #b5cea8; }
        .vscode-comment { color: #6a9955; }
        .partition-line { border-right: 4px dashed #f59e0b; height: 100%; position: relative; z-index: 20; }
        .active-cell { border-color: #569cd6 !important; background: rgba(86, 156, 214, 0.2); transform: scale(1.05); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #3e3e42; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col text-[13px]">

<div class="h-9 vscode-bg-side border-b vscode-border flex items-center px-4 text-xs">
    <div class="bg-[#1e1e1e] px-4 h-full flex items-center border-t border-blue-500 text-white">
        solution_v3_binary_search.py
    </div>
</div>

<main class="flex flex-1 overflow-hidden">
    
    <aside class="w-[30%] vscode-bg-side border-r vscode-border flex flex-col p-5 overflow-y-auto">
        <h1 class="text-xl font-bold text-white mb-2">4. Median of Two Sorted Arrays</h1>
        
        <div class="bg-black/30 p-4 rounded border vscode-border mb-6">
            <h3 class="text-blue-400 font-bold text-xs mb-2 italic"># Problem Description</h3>
            <p class="text-[11px] leading-relaxed opacity-90">
                給定兩個正序數組 <code class="bg-gray-800 px-1">nums1</code> 和 <code class="bg-gray-800 px-1">nums2</code>。請找出並返回這兩個數組的 <span class="text-white underline font-bold">中位數</span>。
            </p>
            <p class="mt-2 text-orange-400 text-[11px]">目標：O(log(min(m, n))) 複雜度。</p>
        </div>

        <div id="logic-section" class="space-y-4">
            </div>

        <div class="mt-8 space-y-4">
            <div>
                <label class="text-[10px] uppercase font-bold opacity-40 block mb-2 tracking-widest text-blue-400">Algorithm Switch</label>
                <select id="solution-selector" onchange="changeSolution()" class="w-full bg-[#3c3c3c] p-2 rounded outline-none border vscode-border focus:border-blue-500 text-white font-bold cursor-pointer">
                    <option value="brute">1. Brute Force (Sort)</option>
                    <option value="pointer">2. Two Pointers (Linear)</option>
                    <option value="binary" selected>3. Binary Search (Partition)</option>
                </select>
            </div>
            
            <div class="grid grid-cols-3 gap-2">
                <button onclick="setTest(1)" class="py-2 bg-[#3c3c3c] hover:bg-gray-600 rounded text-[10px]">Example 1</button>
                <button onclick="setTest(2)" class="py-2 bg-[#3c3c3c] hover:bg-gray-600 rounded text-[10px]">Example 2</button>
                <button onclick="setTest(3)" class="py-2 bg-blue-900/40 border border-blue-700 hover:bg-blue-800/40 rounded text-[10px]">Hard Case</button>
            </div>
        </div>
    </aside>

    <section class="w-[40%] bg-[#1e1e1e] flex flex-col border-r vscode-border">
        <div class="p-4 border-b vscode-border flex justify-between items-center bg-black/5">
            <span class="text-[10px] font-bold opacity-40 uppercase tracking-widest">Execution Trace</span>
            <span id="step-counter" class="text-xs vscode-accent font-bold">Step: 0 / 0</span>
        </div>
        
        <div id="visualizer-content" class="flex-1 flex flex-col justify-center items-center p-8 space-y-12"></div>

        <div class="h-20 vscode-bg-side border-t vscode-border flex items-center justify-center gap-6">
            <button onclick="reset()" class="text-[10px] opacity-40 hover:opacity-100 uppercase font-bold">Reset</button>
            <div class="flex items-center gap-4">
                <button onclick="prev()" class="p-2 hover:bg-white/10 rounded-full transition-all">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
                </button>
                <button onclick="togglePlay()" id="play-btn" class="w-12 h-12 bg-blue-600 hover:bg-blue-500 rounded-full flex items-center justify-center shadow-lg transition-transform active:scale-90">
                    <svg id="play-icon" width="24" height="24" fill="white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button onclick="next()" class="p-2 hover:bg-white/10 rounded-full transition-all">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
                </button>
            </div>
        </div>
    </section>

    <aside class="w-[30%] vscode-bg-side flex flex-col border-l vscode-border">
        <div class="flex-1 p-0 text-[12px] font-mono overflow-y-auto" id="code-container"></div>

        <div class="h-80 bg-[#1e1e1e] border-t-2 vscode-border p-5">
            <div class="text-[10px] uppercase font-bold opacity-40 mb-3 flex justify-between">
                <span>Debugger Variables</span>
                <span id="status-tag" class="px-2 rounded bg-blue-600 text-white">READY</span>
            </div>
            <div id="watcher-list" class="grid grid-cols-2 gap-3 text-[12px]"></div>
            <div id="final-result-container" class="mt-6 pt-4 border-t vscode-border text-center hidden">
                <div class="text-[10px] opacity-40 uppercase">Computed Median</div>
                <div id="res-val" class="text-3xl font-bold text-green-400">0</div>
            </div>
        </div>
    </aside>
</main>

<script>
    const STATE = {
        solution: 'binary',
        currentStep: 0,
        isPlaying: false,
        timer: null,
        nums1: [1, 2],
        nums2: [3, 4, 5, 6],
        steps: []
    };

    const SOLUTIONS = {
        brute: {
            time: "O((m+n) log(m+n))", 
            space: "O(m+n)",
            intuition: "直接將兩數組連接後排序。這是最簡單的想法，但無法滿足面試中對時間複雜度的要求。",
            code: [
                `<span class="vscode-keyword">class</span> <span class="vscode-func">Solution</span>:`,
                `    <span class="vscode-keyword">def</span> <span class="vscode-func">findMedianSortedArrays</span>(self, nums1, nums2):`,
                `        merged = nums1 + nums2`,
                `        merged.sort()`,
                `        total = len(merged)`,
                `        <span class="vscode-keyword">if</span> total % <span class="vscode-num">2</span> == <span class="vscode-num">0</span>:`,
                `            <span class="vscode-keyword">return</span> (merged[total//<span class="vscode-num">2</span>-<span class="vscode-num">1</span>] + merged[total//<span class="vscode-num">2</span>]) / <span class="vscode-num">2.0</span>`,
                `        <span class="vscode-keyword">return</span> float(merged[total//<span class="vscode-num">2</span>])`
            ],
            gen: (n1, n2) => {
                let m = [...n1, ...n2], s = [...m].sort((a,b)=>a-b);
                let mid = Math.floor(s.length/2);
                let steps = [
                    { line: 2, watch: { merged: JSON.stringify(m) }, visual: { m, active: [] } },
                    { line: 3, watch: { merged: JSON.stringify(s) }, visual: { m: s, active: [] } }
                ];
                if(s.length % 2 === 0) steps.push({ line: 6, watch: { res: (s[mid-1]+s[mid])/2 }, visual: { m: s, active: [mid-1, mid] }, done: true });
                else steps.push({ line: 7, watch: { res: s[mid] }, visual: { m: s, active: [mid] }, done: true });
                return steps;
            }
        },
        pointer: {
            time: "O(m+n)", 
            space: "O(1)",
            intuition: "利用兩個指針從頭開始掃描。我們不需要真的合併，只需要『數』到中間位置即可。",
            code: [
                `<span class="vscode-keyword">class</span> <span class="vscode-func">Solution</span>:`,
                `    <span class="vscode-keyword">def</span> <span class="vscode-func">findMedianSortedArrays</span>(self, nums1, nums2):`,
                `        i = j = m1 = m2 = <span class="vscode-num">0</span>`,
                `        target = (len(nums1) + len(nums2)) // <span class="vscode-num">2</span>`,
                `        <span class="vscode-keyword">for</span> _ <span class="vscode-keyword">in</span> range(target + <span class="vscode-num">1</span>):`,
                `            m2 = m1`,
                `            <span class="vscode-keyword">if</span> i < len(nums1) <span class="vscode-keyword">and</span> (j >= len(nums2) <span class="vscode-keyword">or</span> nums1[i] < nums2[j]):`,
                `                m1 = nums1[i]; i += <span class="vscode-num">1</span>`,
                `            <span class="vscode-keyword">else</span>:`,
                `                m1 = nums2[j]; j += <span class="vscode-num">1</span>`,
                `        <span class="vscode-keyword">if</span> (len(nums1) + len(nums2)) % <span class="vscode-num">2</span>: <span class="vscode-keyword">return</span> float(m1)`,
                `        <span class="vscode-keyword">return</span> (m1 + m2) / <span class="vscode-num">2.0</span>`
            ],
            gen: (n1, n2) => {
                let steps = [], i = 0, j = 0, m1 = 0, m2 = 0;
                let total = n1.length + n2.length, target = Math.floor(total / 2);
                steps.push({ line: 2, watch: { i, j, m1, m2 }, visual: { i, j, m1, m2 } });
                for(let c=0; c<=target; c++) {
                    m2 = m1;
                    if(i < n1.length && (j >= n2.length || n1[i] < n2[j])) { m1 = n1[i]; i++; }
                    else { m1 = n2[j]; j++; }
                    steps.push({ line: 7, watch: { i, j, m1, m2, count: c }, visual: { i, j, m1, m2 } });
                }
                if(total % 2 === 1) steps.push({ line: 10, watch: { res: m1 }, visual: { i, j, m1, m2 }, done: true });
                else steps.push({ line: 11, watch: { res: (m1+m2)/2 }, visual: { i, j, m1, m2 }, done: true });
                return steps;
            }
        },
        binary: {
            time: "O(log(min(m,n)))", 
            space: "O(1)",
            intuition: "不尋找數值，而是尋找『切點』。我們在短數組畫一刀，長數組的對應切點就會自動固定，使左右數量平衡。",
            algorithm: [
                "1. 確保 A 是較短的數組。",
                "2. 二分搜尋 A 的切點 i，則 B 切點 j = (total//2) - i - 2。",
                "3. 驗證: A[i] <= B[j+1] 且 B[j] <= A[i+1]。",
                "4. 若 A[i] > B[j+1]，代表 A 切點太右，應往左移。",
                "5. 反之往右移。"
            ],
            code: [
                `<span class="vscode-keyword">class</span> <span class="vscode-func">Solution</span>:`,
                `    <span class="vscode-keyword">def</span> <span class="vscode-func">findMedianSortedArrays</span>(self, nums1, nums2):`,
                `        A, B = (nums1, nums2) <span class="vscode-keyword">if</span> len(nums1) <= len(nums2) <span class="vscode-keyword">else</span> (nums2, nums1)`,
                `        total, half = len(A) + len(B), (len(A) + len(B)) // <span class="vscode-num">2</span>`,
                `        l, r = <span class="vscode-num">0</span>, len(A) - <span class="vscode-num">1</span>`,
                `        <span class="vscode-keyword">while</span> <span class="vscode-keyword">True</span>:`,
                `            i = (l + r) // <span class="vscode-num">2</span>; j = half - i - <span class="vscode-num">2</span>`,
                `            Al = A[i] <span class="vscode-keyword">if</span> i >= <span class="vscode-num">0</span> <span class="vscode-keyword">else</span> float(<span class="vscode-string">"-inf"</span>)`,
                `            Ar = A[i+1] <span class="vscode-keyword">if</span> (i+1) < len(A) <span class="vscode-keyword">else</span> float(<span class="vscode-string">"inf"</span>)`,
                `            Bl = B[j] <span class="vscode-keyword">if</span> j >= <span class="vscode-num">0</span> <span class="vscode-keyword">else</span> float(<span class="vscode-string">"-inf"</span>)`,
                `            Br = B[j+1] <span class="vscode-keyword">if</span> (j+1) < len(B) <span class="vscode-keyword">else</span> float(<span class="vscode-string">"inf"</span>)`,
                `            <span class="vscode-keyword">if</span> Al <= Br <span class="vscode-keyword">and</span> Bl <= Ar:`,
                `                <span class="vscode-keyword">if</span> total % <span class="vscode-num">2</span>: <span class="vscode-keyword">return</span> min(Ar, Br)`,
                `                <span class="vscode-keyword">return</span> (max(Al, Bl) + min(Ar, Br)) / <span class="vscode-num">2.0</span>`,
                `            <span class="vscode-keyword">elif</span> Al > Br: r = i - <span class="vscode-num">1</span>`,
                `            <span class="vscode-keyword">else</span>: l = i + <span class="vscode-num">1</span>`
            ],
            gen: (n1, n2) => {
                let A = n1, B = n2; if(B.length < A.length) [A, B] = [B, A];
                let total = A.length + B.length, half = Math.floor(total/2), l = 0, r = A.length-1, steps = [];
                while(true) {
                    let i = Math.floor((l+r)/2), j = half - i - 2;
                    let Al = i >= 0 ? A[i] : -Infinity, Ar = (i+1) < A.length ? A[i+1] : Infinity;
                    let Bl = j >= 0 ? B[j] : -Infinity, Br = (j+1) < B.length ? B[j+1] : Infinity;
                    steps.push({ line: 6, watch: { l, r, i, j, Al, Ar, Bl, Br }, visual: { A, B, i, j, Al, Ar, Bl, Br } });
                    if(Al <= Br && Bl <= Ar) {
                        let res = (total % 2) ? Math.min(Ar, Br) : (Math.max(Al, Bl) + Math.min(Ar, Br)) / 2;
                        steps.push({ line: (total%2?12:13), watch: { res }, visual: { A, B, i, j, Al, Ar, Bl, Br }, done: true });
                        return steps;
                    } else if (Al > Br) {
                        steps.push({ line: 14, watch: { action: "r = i - 1" }, visual: { A, B, i, j, Al, Ar, Bl, Br, err: 'Al>Br' } });
                        r = i - 1;
                    } else {
                        steps.push({ line: 15, watch: { action: "l = i + 1" }, visual: { A, B, i, j, Al, Ar, Bl, Br, err: 'Bl>Ar' } });
                        l = i + 1;
                    }
                }
            }
        }
    };

    function render() {
        const sol = SOLUTIONS[STATE.solution];
        
        // Logic Section with Complexities
        let logicHTML = `
            <div class="flex gap-2 mb-4">
                <div class="flex-1 bg-blue-500/10 border border-blue-500/20 p-2 rounded text-center">
                    <div class="text-[8px] opacity-40 uppercase font-bold tracking-tighter">Time Complexity</div>
                    <div class="text-blue-300 font-bold text-[11px]">${sol.time}</div>
                </div>
                <div class="flex-1 bg-purple-500/10 border border-purple-500/20 p-2 rounded text-center">
                    <div class="text-[8px] opacity-40 uppercase font-bold tracking-tighter">Space Complexity</div>
                    <div class="text-purple-300 font-bold text-[11px]">${sol.space}</div>
                </div>
            </div>
            <h3 class="text-blue-400 font-bold text-xs mb-1 italic"># Intuition</h3>
            <p class="text-[11px] opacity-80">${sol.intuition}</p>`;
            
        if(sol.algorithm) {
            logicHTML += `<h3 class="text-orange-400 font-bold text-xs mt-4 mb-1 italic"># Algorithm</h3><ul class="text-[10px] space-y-1 opacity-70">${sol.algorithm.map(s => `<li>${s}</li>`).join('')}</ul>`;
        }
        document.getElementById('logic-section').innerHTML = logicHTML;

        // Code
        const steps = sol.gen(STATE.nums1, STATE.nums2);
        const curr = steps[STATE.currentStep] || steps[0];
        document.getElementById('code-container').innerHTML = sol.code.map((l, idx) => `
            <div class="flex ${curr.line === idx ? 'line-highlight' : ''} py-0.5">
                <span class="w-8 opacity-20 text-right pr-2 select-none">${idx}</span>
                <pre class="flex-1">${l}</pre>
            </div>`).join('');

        // Watcher
        document.getElementById('watcher-list').innerHTML = Object.entries(curr.watch).map(([k,v]) => `
            <div class="bg-black/20 p-2 rounded border border-white/5 flex flex-col">
                <span class="text-[9px] opacity-40 uppercase font-bold">${k}</span>
                <span class="text-blue-300 font-bold">${v === Infinity ? 'inf' : (v === -Infinity ? '-inf' : v)}</span>
            </div>`).join('');

        // Results
        const resCont = document.getElementById('final-result-container');
        if(curr.done) {
            resCont.classList.remove('hidden');
            document.getElementById('res-val').innerText = curr.watch.res;
            document.getElementById('status-tag').innerText = "COMPLETED";
            document.getElementById('status-tag').className = "px-2 rounded bg-green-600 text-white text-[9px]";
        } else {
            resCont.classList.add('hidden');
            document.getElementById('status-tag').innerText = "DEBUGGING";
            document.getElementById('status-tag').className = "px-2 rounded bg-blue-600 text-white text-[9px]";
        }

        document.getElementById('step-counter').innerText = `Step: ${STATE.currentStep + 1} / ${steps.length}`;
        renderVisual(curr.visual);
    }

    function renderVisual(v) {
        const stage = document.getElementById('visualizer-content');
        if(STATE.solution === 'brute') {
            stage.innerHTML = `<div class="flex flex-wrap gap-2 justify-center">${v.m.map((x,idx)=>`<div class="w-12 h-12 border-2 vscode-border rounded flex flex-col items-center justify-center font-bold ${v.active.includes(idx)?'active-cell border-blue-500 shadow-lg shadow-blue-500/20':''}"><span class="text-[8px] opacity-30">${idx}</span>${x}</div>`).join('')}</div>`;
        } else if(STATE.solution === 'pointer') {
            stage.innerHTML = `
                <div class="w-full max-w-sm space-y-10">
                    <div><div class="text-[9px] mb-1 opacity-50 uppercase font-bold">nums1 (i=${v.i})</div><div class="flex gap-1 h-10">${STATE.nums1.map((x,idx)=>`<div class="flex-1 border-2 vscode-border rounded flex items-center justify-center transition-all ${v.i===idx?'border-blue-500 bg-blue-500/20':'opacity-30' }">${x}</div>`).join('')}</div></div>
                    <div><div class="text-[9px] mb-1 opacity-50 uppercase font-bold">nums2 (j=${v.j})</div><div class="flex gap-1 h-10">${STATE.nums2.map((x,idx)=>`<div class="flex-1 border-2 vscode-border rounded flex items-center justify-center transition-all ${v.j===idx?'border-purple-500 bg-purple-500/20':'opacity-30' }">${x}</div>`).join('')}</div></div>
                    <div class="flex justify-between items-center pt-6 border-t vscode-border">
                        <div class="text-center opacity-40"><div class="text-[9px]">M2 (prev)</div><div class="text-2xl">${v.m2}</div></div>
                        <div class="text-center scale-125"><div class="text-[9px] text-blue-400 font-bold italic">M1 (current)</div><div class="text-4xl font-bold">${v.m1}</div></div>
                    </div>
                </div>`;
        } else {
            stage.innerHTML = `
                <div class="w-full space-y-14">
                    <div class="relative">
                        <div class="text-[9px] mb-1 opacity-50 uppercase font-bold">Array A (Smaller)</div>
                        <div class="flex gap-1 h-14 relative">
                            ${v.A.map((x,idx)=>`<div class="flex-1 border-2 vscode-border rounded flex items-center justify-center ${idx===v.i?'border-orange-500 bg-orange-500/10 font-bold scale-110 z-10 shadow-xl shadow-orange-500/20':''}">${x}</div>${idx===v.i?'<div class="partition-line mx-1"></div>':''}`).join('')}
                            ${v.i === -1 ? '<div class="partition-line mx-1"></div>' : ''}
                        </div>
                    </div>
                    <div class="relative">
                        <div class="text-[9px] mb-1 opacity-50 uppercase font-bold">Array B (Larger)</div>
                        <div class="flex gap-1 h-14 relative">
                            ${v.B.map((x,idx)=>`<div class="flex-1 border-2 vscode-border rounded flex items-center justify-center ${idx===v.j?'border-orange-500 bg-orange-500/10 font-bold scale-110 z-10 shadow-xl shadow-orange-500/20':''}">${x}</div>${idx===v.j?'<div class="partition-line mx-1"></div>':''}`).join('')}
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-[11px]">
                        <div class="p-3 border rounded vscode-border flex justify-between ${v.err==='Al>Br'?'border-red-500 bg-red-900/20 animate-pulse':'opacity-60'}"><span>Al(${v.Al}) ≤ Br(${v.Br})</span> <span>${v.Al<=v.Br?'✅':'❌'}</span></div>
                        <div class="p-3 border rounded vscode-border flex justify-between ${v.err==='Bl>Ar'?'border-red-500 bg-red-900/20 animate-pulse':'opacity-60'}"><span>Bl(${v.Bl}) ≤ Ar(${v.Ar})</span> <span>${v.Bl<=v.Ar?'✅':'❌'}</span></div>
                    </div>
                </div>`;
        }
    }

    function setTest(n) {
        if(n===1) { STATE.nums1=[1,3]; STATE.nums2=[2]; }
        else if(n===2) { STATE.nums1=[1,2]; STATE.nums2=[3,4]; }
        else { STATE.nums1=[2, 8, 15, 20]; STATE.nums2=[1, 3, 5, 7, 10, 11, 25]; }
        reset();
    }
    function changeSolution() { STATE.solution = document.getElementById('solution-selector').value; reset(); }
    function next() { const limit = SOLUTIONS[STATE.solution].gen(STATE.nums1, STATE.nums2).length; if (STATE.currentStep < limit - 1) { STATE.currentStep++; render(); } else if (STATE.isPlaying) togglePlay(); }
    function prev() { if (STATE.currentStep > 0) { STATE.currentStep--; render(); } }
    function togglePlay() { 
        STATE.isPlaying = !STATE.isPlaying; 
        document.getElementById('play-icon').innerHTML = STATE.isPlaying ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
        if (STATE.isPlaying) STATE.timer = setInterval(next, 900); else clearInterval(STATE.timer); 
    }
    function reset() { STATE.currentStep = 0; if (STATE.isPlaying) togglePlay(); render(); }

    render();
</script>
</body>
</html>
