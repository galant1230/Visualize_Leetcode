<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search a 2D Matrix 演算法模擬器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Fira Code', 'JetBrains Mono', monospace;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar { background-color: #252526; }
        .active-line {
            background-color: rgba(38, 79, 120, 0.5);
            border-left: 3px solid #007acc;
        }
        .token-keyword { color: #569cd6; }
        .token-function { color: #dcdcaa; }
        .token-comment { color: #6a9955; }
        .token-number { color: #b5cea8; }
        .cell-highlight {
            animation: pulse 0.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { border-color: #007acc; background-color: #264f78; }
            50% { border-color: #4fc1ff; background-color: #3e3e42; }
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col">

    <header class="h-14 border-b border-zinc-800 flex items-center px-6 justify-between bg-[#252526]">
        <div class="font-bold text-lg text-white flex items-center gap-2">
            <span class="text-blue-400">#74</span> Search a 2D Matrix 模擬器
        </div>
        <div class="text-xs text-zinc-500 font-mono">Status: <span id="status-text" class="text-green-400">Ready</span></div>
    </header>

    <main class="flex-1 flex overflow-hidden p-4 gap-4">
        
        <section class="w-1/4 flex flex-col gap-4 overflow-y-auto hide-scrollbar">
            <div class="sidebar p-6 rounded-md">
                <h2 class="text-blue-400 font-bold mb-2">題目敘述</h2>
                <p class="text-sm leading-relaxed mb-4">
                    在 <code class="bg-zinc-800 px-1">m x n</code> 矩陣中找 <code class="bg-zinc-800 px-1">target</code>。
                    <span class="text-zinc-500 block mt-2">將矩陣視為連續的 index：</span>
                    <span class="text-xs text-yellow-500/80 font-mono">row = mid // n</span><br>
                    <span class="text-xs text-yellow-500/80 font-mono">col = mid % n</span>
                </p>
            </div>

            <div class="sidebar p-6 rounded-md">
                <h2 class="text-blue-400 font-bold mb-2">複雜度分析</h2>
                <div class="flex gap-2 mb-2">
                    <span class="px-2 py-1 bg-green-900/30 text-green-400 text-xs rounded border border-green-800">O(log(m*n))</span>
                    <span class="px-2 py-1 bg-blue-900/30 text-blue-400 text-xs rounded border border-blue-800">O(1)</span>
                </div>
            </div>

            <div class="sidebar p-6 rounded-md flex-1">
                <h2 class="text-blue-400 font-bold mb-4">切換測試用例</h2>
                <div class="space-y-2">
                    <button onclick="loadTestCase(0)" class="w-full text-left p-2 rounded bg-zinc-800 hover:bg-zinc-700 text-xs border border-zinc-700 test-case-btn active-case">
                        Ex 1: target = 3 (True)
                    </button>
                    <button onclick="loadTestCase(1)" class="w-full text-left p-2 rounded bg-zinc-800 hover:bg-zinc-700 text-xs border border-zinc-700 test-case-btn">
                        Ex 2: target = 13 (False)
                    </button>
                </div>
            </div>
        </section>

        <section class="w-[45%] flex flex-col gap-4">
            <div class="sidebar flex-1 rounded-md p-6 flex flex-col relative overflow-hidden">
                <h2 class="text-zinc-500 text-sm uppercase tracking-widest mb-6">Matrix Visualizer</h2>
                <div id="matrix-container" class="flex justify-center items-center flex-1">
                    </div>

                <div class="mt-auto pt-6 border-t border-zinc-800">
                    <div class="grid grid-cols-3 gap-4">
                        <div class="bg-zinc-900/50 p-3 rounded text-center border border-zinc-800">
                            <div class="text-[10px] text-zinc-500">LEFT (Idx)</div>
                            <div id="val-left" class="text-xl font-bold text-blue-400">-</div>
                        </div>
                        <div class="bg-zinc-900/50 p-3 rounded text-center border border-zinc-800">
                            <div class="text-[10px] text-zinc-500">MID (Idx)</div>
                            <div id="val-mid" class="text-xl font-bold text-yellow-400">-</div>
                        </div>
                        <div class="bg-zinc-900/50 p-3 rounded text-center border border-zinc-800">
                            <div class="text-[10px] text-zinc-500">RIGHT (Idx)</div>
                            <div id="val-right" class="text-xl font-bold text-red-400">-</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="sidebar h-20 rounded-md flex items-center justify-between px-8">
                <div class="flex gap-4">
                    <button onclick="prevStep()" class="p-2 hover:bg-zinc-700 rounded text-zinc-400">上一步</button>
                    <button onclick="togglePlay()" id="play-btn" class="px-6 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-md text-sm transition-all">播放</button>
                    <button onclick="nextStep()" class="p-2 hover:bg-zinc-700 rounded text-zinc-400">下一步</button>
                    <button onclick="resetSim()" class="p-2 hover:bg-zinc-700 rounded text-zinc-400">重置</button>
                </div>
                <div class="text-xs font-mono text-zinc-500">STEP: <span id="current-step" class="text-zinc-300">0</span> / <span id="total-steps">0</span></div>
            </div>
        </section>

        <section class="w-[30%] flex flex-col gap-4 overflow-hidden">
            <div class="sidebar flex-1 rounded-md overflow-hidden flex flex-col">
                <div class="bg-[#323233] px-4 py-2 text-xs text-zinc-400">solution.py</div>
                <div id="code-area" class="p-4 text-xs leading-6 overflow-y-auto flex-1 bg-[#1e1e1e] font-mono">
                    </div>
            </div>

            <div class="sidebar h-1/3 rounded-md p-6 overflow-y-auto">
                <h2 class="text-blue-400 font-bold mb-3 text-sm">變數監控 (Watcher)</h2>
                <div id="watcher-list" class="space-y-2 text-xs font-mono">
                    </div>
            </div>
        </section>
    </main>

    <script>
        const testCases = [
            { matrix: [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target: 3 },
            { matrix: [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target: 13 }
        ];

        const pythonCode = [
            "def searchMatrix(matrix, target):",
            "    m, n = len(matrix), len(matrix[0])",
            "    left, right = 0, m * n - 1",
            "    while left <= right:",
            "        mid = (left + right) // 2",
            "        row = mid // n",
            "        col = mid % n",
            "        value = matrix[row][col]",
            "        if value == target:",
            "            return True",
            "        elif value < target:",
            "            left = mid + 1",
            "        else:",
            "            right = mid - 1",
            "    return False"
        ];

        let currentIdx = 0;
        let steps = [];
        let currentStepIdx = 0;
        let isPlaying = false;
        let timer = null;

        function generateSteps(matrix, target) {
            const res = [];
            const m = matrix.length, n = matrix[0].length;
            let left = 0, right = m * n - 1;

            res.push({ line: 1, left: null, right: null, mid: null, row: null, col: null, val: null, msg: "初始化 m, n" });
            res.push({ line: 2, left, right, mid: null, row: null, col: null, val: null, msg: "初始化 left, right" });

            while (left <= right) {
                res.push({ line: 3, left, right, mid: null, row: null, col: null, val: null, msg: "檢查迴圈條件 left <= right" });
                let mid = Math.floor((left + right) / 2);
                let row = Math.floor(mid / n);
                let col = mid % n;
                let value = matrix[row][col];

                res.push({ line: 4, left, right, mid, row: null, col: null, val: null, msg: `計算 mid = ${mid}` });
                res.push({ line: 5, left, right, mid, row, col: null, val: null, msg: `轉換 row = ${mid} // ${n} = ${row}` });
                res.push({ line: 6, left, right, mid, row, col, val: null, msg: `轉換 col = ${mid} % ${n} = ${col}` });
                res.push({ line: 7, left, right, mid, row, col, val: value, msg: `取得 matrix[${row}][${col}] = ${value}` });

                res.push({ line: 8, left, right, mid, row, col, val: value, msg: `比較 ${value} 與 ${target}` });
                if (value === target) {
                    res.push({ line: 9, left, right, mid, row, col, val: value, msg: "找到目標！返回 True" });
                    return res;
                } else if (value < target) {
                    res.push({ line: 10, left, right, mid, row, col, val: value, msg: `${value} < ${target}` });
                    left = mid + 1;
                    res.push({ line: 11, left, right, mid, row, col, val: value, msg: "更新 left = mid + 1" });
                } else {
                    res.push({ line: 12, left, right, mid, row, col, val: value, msg: `${value} > ${target}` });
                    right = mid - 1;
                    res.push({ line: 13, left, right, mid, row, col, val: value, msg: "更新 right = mid - 1" });
                }
            }
            res.push({ line: 14, left, right, mid: null, row: null, col: null, val: null, msg: "搜尋完畢，返回 False" });
            return res;
        }

        function renderCode() {
            document.getElementById('code-area').innerHTML = pythonCode.map((line, i) => `
                <div id="line-${i}" class="px-2 whitespace-pre flex border-l-2 border-transparent">
                    <span class="w-8 text-zinc-600 text-right mr-4 select-none">${i}</span>
                    <span>${line.replace(/\b(def|while|if|elif|else|return|True|False)\b/g, '<span class="token-keyword">$1</span>')}</span>
                </div>
            `).join('');
        }

        function renderMatrix() {
            const container = document.getElementById('matrix-container');
            const { matrix } = testCases[currentIdx];
            const m = matrix.length, n = matrix[0].length;
            const step = steps[currentStepIdx];

            container.innerHTML = `
                <div class="grid gap-2" style="grid-template-columns: repeat(${n}, 1fr)">
                    ${matrix.flat().map((v, i) => {
                        let style = "bg-zinc-800/40 border-zinc-700 text-zinc-500";
                        if (step.mid === i) style = "bg-yellow-900/40 border-yellow-500 text-white cell-highlight";
                        else if (step.left !== null && i >= step.left && i <= step.right) style = "bg-blue-900/20 border-blue-700 text-zinc-200";

                        return `<div class="w-14 h-14 border-2 rounded flex flex-col items-center justify-center transition-all duration-300 ${style}">
                            <div class="text-[8px] opacity-50 font-mono">${i}</div>
                            <div class="text-sm font-bold">${v}</div>
                        </div>`;
                    }).join('')}
                </div>
            `;
        }

        function updateUI() {
            const step = steps[currentStepIdx];
            
            document.querySelectorAll('#code-area div').forEach(el => el.classList.remove('active-line'));
            document.getElementById(`line-${step.line}`)?.classList.add('active-line');

            renderMatrix();

            document.getElementById('val-left').textContent = step.left !== null ? step.left : '-';
            document.getElementById('val-right').textContent = step.right !== null ? step.right : '-';
            document.getElementById('val-mid').textContent = step.mid !== null ? step.mid : '-';
            document.getElementById('current-step').textContent = currentStepIdx;

            document.getElementById('watcher-list').innerHTML = `
                <div class="flex justify-between border-b border-zinc-800 pb-1"><span>Target:</span> <span class="text-yellow-500">${testCases[currentIdx].target}</span></div>
                <div class="flex justify-between border-b border-zinc-800 pb-1"><span>Current Row:</span> <span class="text-blue-400">${step.row !== null ? step.row : 'None'}</span></div>
                <div class="flex justify-between border-b border-zinc-800 pb-1"><span>Current Col:</span> <span class="text-blue-400">${step.col !== null ? step.col : 'None'}</span></div>
                <div class="flex justify-between border-b border-zinc-800 pb-1"><span>Value:</span> <span class="text-white font-bold">${step.val !== null ? step.val : 'None'}</span></div>
                <div class="mt-2 text-blue-300 italic opacity-80">> ${step.msg}</div>
            `;
        }

        function loadTestCase(idx) {
            currentIdx = idx;
            document.querySelectorAll('.test-case-btn').forEach((b, i) => b.className = `w-full text-left p-2 rounded bg-zinc-800 hover:bg-zinc-700 text-xs border ${i === idx ? 'border-blue-500 active-case' : 'border-zinc-700'} test-case-btn`);
            resetSim();
        }

        function resetSim() {
            stopAutoPlay();
            currentStepIdx = 0;
            steps = generateSteps(testCases[currentIdx].matrix, testCases[currentIdx].target);
            document.getElementById('total-steps').textContent = steps.length - 1;
            updateUI();
        }

        function nextStep() { if (currentStepIdx < steps.length - 1) { currentStepIdx++; updateUI(); } else stopAutoPlay(); }
        function prevStep() { if (currentStepIdx > 0) { currentStepIdx--; updateUI(); } }
        function togglePlay() { isPlaying ? stopAutoPlay() : startAutoPlay(); }
        function startAutoPlay() { isPlaying = true; document.getElementById('play-btn').textContent = "暫停"; timer = setInterval(nextStep, 600); }
        function stopAutoPlay() { isPlaying = false; document.getElementById('play-btn').textContent = "播放"; clearInterval(timer); }

        renderCode();
        resetSim();
    </script>
</body>
</html>
