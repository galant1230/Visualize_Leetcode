<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>104. Maximum Depth of Binary Tree - Visualizer</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --card: #282828;
      --border: #3e3e3e;
      --text: #eff1f6;
      --text-dim: #8a8a8a;
      --orange: #ffa116;
      --medium: #ffc01e;
      --blue: #007aff;
      --purple: #a855f7;
      --red: #ff2d55;
      --green: #50fa7b;
      --active-line: rgba(255, 161, 22, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 16px; line-height: 1.5; }
    
    .header { max-width: 1440px; margin: 0 auto 12px auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .logo { font-weight: bold; font-size: 1.2rem; color: var(--orange); }
    .badge { background: rgba(80, 250, 123, 0.15); color: var(--green); padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
    .tag { background: #383838; color: var(--text-dim); padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }

    .approach-tabs { max-width: 1440px; margin: 0 auto 12px auto; display: flex; gap: 6px; flex-wrap: wrap; background: #222; padding: 6px; border-radius: 6px; border: 1px solid var(--border); }
    .app-tab-btn { background: transparent; border: none; color: var(--text-dim); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.78rem; font-weight: 600; transition: 0.2s; }
    .app-tab-btn:hover { background: #333; color: #fff; }
    .app-tab-btn.active { background: var(--orange); color: #000; }

    .tabs { max-width: 1440px; margin: 0 auto 12px auto; display: flex; gap: 8px; align-items: center; }
    .tab-btn { background: #202020; border: 1px solid var(--border); color: var(--text-dim); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.78rem; }
    .tab-btn.active { background: #383838; color: #fff; border-color: var(--text-dim); }

    .grid { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.1fr; gap: 12px; }
    @media (max-width: 1024px) { .grid { grid-template-columns: 1fr; } }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .card-title { font-size: 0.85rem; font-weight: bold; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; }
    
    .problem-desc { font-size: 0.82rem; color: #ccc; }
    .example-box { background: #1e1e1e; border: 1px solid var(--border); border-left: 3px solid var(--orange); padding: 6px 10px; border-radius: 4px; font-family: monospace; font-size: 0.78rem; }
    
    .complexity-container { display: flex; gap: 8px; }
    .complexity-box { flex: 1; background: #1e1e1e; border: 1px solid var(--border); padding: 6px 8px; border-radius: 4px; font-size: 0.75rem; }
    .complexity-val { font-family: monospace; font-weight: bold; color: var(--medium); display: block; font-size: 0.85rem; }

    .approach-box { background: #1e1e1e; border: 1px solid var(--border); border-left: 3px solid var(--blue); padding: 8px 10px; border-radius: 4px; font-size: 0.8rem; color: #ddd; }

    .code-box { background: #1e1e1e; border: 1px solid var(--border); border-radius: 4px; padding: 8px 0; font-family: monospace; font-size: 0.75rem; overflow-x: auto; max-height: 480px; }
    .code-line { padding: 2px 12px; white-space: pre; border-left: 3px solid transparent; line-height: 1.4; }
    .code-line.active { background: var(--active-line); border-left-color: var(--orange); }
    .kw { color: #ff79c6; } .fn { color: #8be9fd; } .comment { color: var(--green); font-style: italic; } .cls { color: #50fa7b; }

    /* 固定 Stage Box 以及內部元素的高度，完全防跳動 */
    .stage { background: #1e1e1e; border: 1px solid var(--border); border-radius: 6px; padding: 12px; height: 390px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; overflow: hidden; }
    
    /* 樹狀結構 SVG 視覺化樣式 */
    .tree-container { display: flex; justify-content: center; align-items: center; position: relative; height: 190px; width: 100%; }
    svg.tree-svg { width: 100%; height: 100%; }
    .tree-node-circle { fill: #333; stroke: var(--border); stroke-width: 2px; transition: all 0.3s; }
    .tree-node-circle.active { fill: rgba(255, 161, 22, 0.3); stroke: var(--orange); stroke-width: 3px; }
    .tree-node-circle.returning { fill: rgba(168, 85, 247, 0.3); stroke: var(--purple); stroke-width: 3px; }
    .tree-node-circle.visited { fill: rgba(80, 250, 123, 0.2); stroke: var(--green); }
    .tree-text { fill: #fff; font-family: monospace; font-weight: bold; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
    .tree-edge { stroke: #555; stroke-width: 2px; transition: all 0.3s; }
    .tree-edge.active { stroke: var(--orange); stroke-width: 3px; }

    /* Stack / Queue 視覺化樣式：高度完全固定 150px */
    .stack-container { background: #141414; border: 1px solid var(--border); padding: 8px 10px; border-radius: 6px; height: 150px; display: flex; flex-direction: column; }
    .stack-title { font-size: 0.75rem; color: var(--orange); font-weight: bold; font-family: monospace; margin-bottom: 6px; display: flex; justify-content: space-between; flex-shrink: 0; }
    .stack-list { display: flex; flex-direction: column-reverse; gap: 4px; overflow-y: auto; flex-grow: 1; padding-right: 2px; }
    .stack-frame { background: #222; border: 1px solid var(--border); border-left: 3px solid var(--blue); padding: 4px 8px; border-radius: 4px; font-family: monospace; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .stack-frame.active { border-left-color: var(--orange); background: rgba(255, 161, 22, 0.15); }
    .stack-frame.top { border-left-color: var(--green); }

    .ds-display { background: #141414; border: 1px solid var(--border); padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; color: var(--purple); height: 150px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; word-break: break-all; }

    .info { background: #141414; border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; font-size: 0.8rem; font-family: monospace; height: 65px; display: flex; flex-direction: column; justify-content: center; }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
    .controls { display: flex; justify-content: flex-end; gap: 8px; }
    .btn { background: #383838; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
    .btn-primary { background: var(--medium); color: #000; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="header">
    <span class="logo">LeetCode</span>
    <span style="font-weight: bold;">104. Maximum Depth of Binary Tree</span>
    <span class="badge">Easy</span>
    <span class="tag">Tree</span>
    <span class="tag">Depth-First Search</span>
    <span class="tag">Breadth-First Search</span>
    <span class="tag">Binary Tree</span>
  </div>

  <div class="approach-tabs" id="app-tabs">
    <button class="app-tab-btn active" onclick="switchApproach(0)">1. DFS Recursive (Bottom-up)</button>
    <button class="app-tab-btn" onclick="switchApproach(1)">2. DFS Recursive (Top-down)</button>
    <button class="app-tab-btn" onclick="switchApproach(2)">3. BFS Iterative (Level Order)</button>
    <button class="app-tab-btn" onclick="switchApproach(3)">4. DFS Iterative (Stack)</button>
  </div>

  <div class="tabs">
    <span style="font-size: 0.8rem; color: var(--text-dim); font-weight: bold;">Presets:</span>
    <button class="tab-btn active" onclick="setPreset(0)">Ex 1: Standard Tree [3,9,20,null,null,15,7]</button>
    <button class="tab-btn" onclick="setPreset(1)">Ex 2: Skewed Tree [1,null,2]</button>
    <button class="tab-btn" onclick="setPreset(2)">Ex 3: Empty Tree []</button>
  </div>

  <div class="grid">
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div class="card">
        <div class="card-title">📝 題目描述與範例</div>
        <div class="problem-desc">
          給定一棵二元樹的根節點 <code>root</code>，請計算並返回其<b>最大深度</b>（即從根節點到最遠葉子節點的最長路徑上的節點總數）。
        </div>
        <div class="example-box" id="ex-display"></div>
        <div class="complexity-container">
          <div class="complexity-box">
            <span style="color: var(--text-dim);">Time Complexity</span>
            <span class="complexity-val" id="time-comp">-</span>
          </div>
          <div class="complexity-box">
            <span style="color: var(--text-dim);">Space Complexity</span>
            <span class="complexity-val" id="space-comp">-</span>
          </div>
        </div>
      </div>

      <div class="card" style="flex: 1;">
        <div class="card-title">
          <span>🐍 Python 完整程式碼</span>
          <span id="stepHint" style="color: var(--orange);">READY</span>
        </div>
        <div class="code-box" id="code-box"></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div class="card">
        <div class="card-title">💡 解題思路說明</div>
        <div class="approach-box" id="approach-desc"></div>
      </div>

      <div class="card" style="flex: 1;">
        <div class="card-title">📊 完整執行步驟視覺化 (Step Visualizer)</div>
        
        <div class="stage" id="stage-box"></div>

        <div class="info">
          <div class="info-row">
            <span style="color: var(--text-dim);">當前階段 (Phase):</span>
            <span id="val-phase" style="color: var(--orange); font-weight: bold;">-</span>
          </div>
          <div id="val-desc" style="color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">-</div>
        </div>

        <div class="controls">
          <button class="btn" onclick="reset()">Reset</button>
          <button class="btn" id="prev-btn" onclick="step(-1)">← Prev</button>
          <button class="btn btn-primary" id="next-btn" onclick="step(1)">Step →</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const approaches = [
      {
        name: "1. DFS Recursive (Bottom-up)",
        time: "O(N)", space: "O(H)",
        desc: "<b>自底向上後序遞迴 (Bottom-up DFS)：</b>對左右子樹分別求解深度，當前節點的最大深度即為 <code>1 + max(left_depth, right_depth)</code>。最精簡、最常見的標準寫法。",
        code: [
          `<span class="kw">class</span> <span class="cls">Solution</span>:`,
          `    <span class="kw">def</span> <span class="fn">maxDepth</span>(<span class="self">self</span>, root: Optional[TreeNode]) -&gt; int:`,
          `        <span class="kw">if not</span> root:`,
          `            <span class="kw">return</span> <span class="kw">0</span>`,
          `        `,
          `        left_depth = <span class="self">self</span>.maxDepth(root.left)`,
          `        right_depth = <span class="self">self</span>.maxDepth(root.right)`,
          `        `,
          `        <span class="kw">return</span> <span class="kw">1</span> + max(left_depth, right_depth)`
        ]
      },
      {
        name: "2. DFS Recursive (Top-down)",
        time: "O(N)", space: "O(H)",
        desc: "<b>自頂向下前序遞迴 (Top-down DFS)：</b>將當前深度作為參數傳遞給子節點。每次深入一層時深度 <code>+1</code>，當遇到葉子節點時更新全局的最大深度。",
        code: [
          `<span class="kw">class</span> <span class="cls">Solution</span>:`,
          `    <span class="kw">def</span> <span class="fn">maxDepth</span>(<span class="self">self</span>, root: Optional[TreeNode]) -&gt; int:`,
          `        <span class="self">self</span>.max_d = <span class="kw">0</span>`,
          `        `,
          `        <span class="kw">def</span> <span class="fn">dfs</span>(node, current_depth):`,
          `            <span class="kw">if not</span> node: <span class="kw">return</span>`,
          `            <span class="self">self</span>.max_d = max(<span class="self">self</span>.max_d, current_depth)`,
          `            dfs(node.left, current_depth + <span class="kw">1</span>)`,
          `            dfs(node.right, current_depth + <span class="kw">1</span>)`,
          `            `,
          `        dfs(root, <span class="kw">1</span>)`,
          `        <span class="kw">return</span> <span class="self">self</span>.max_d`
        ]
      },
      {
        name: "3. BFS Iterative (Level Order)",
        time: "O(N)", space: "O(W)",
        desc: "<b>廣度優先層序走訪 (BFS Iterative)：</b>使用 Queue 進行層序走訪。每處理完一完整整層的節點，深度計數器 <code>depth</code> 就加 1，當 Queue 為空時返回 <code>depth</code>。",
        code: [
          `<span class="kw">from</span> collections <span class="kw">import</span> deque`,
          ``,
          `<span class="kw">class</span> <span class="cls">Solution</span>:`,
          `    <span class="kw">def</span> <span class="fn">maxDepth</span>(<span class="self">self</span>, root: Optional[TreeNode]) -&gt; int:`,
          `        <span class="kw">if not</span> root: <span class="kw">return</span> <span class="kw">0</span>`,
          `        queue = deque([root])`,
          `        depth = <span class="kw">0</span>`,
          `        <span class="kw">while</span> queue:`,
          `            depth += <span class="kw">1</span>`,
          `            <span class="kw">for</span> _ <span class="kw">in</span> range(len(queue)):`,
          `                node = queue.popleft()`,
          `                <span class="kw">if</span> node.left: queue.append(node.left)`,
          `                <span class="kw">if</span> node.right: queue.append(node.right)`,
          `        <span class="kw">return</span> depth`
        ]
      },
      {
        name: "4. DFS Iterative (Stack)",
        time: "O(N)", space: "O(H)",
        desc: "<b>深度優先迭代走訪 (DFS Iterative)：</b>使用 Stack 儲存元組 <code>(node, current_depth)</code> 模擬遞迴系統棧，動態記錄並更新維護的最大深度值。",
        code: [
          `<span class="kw">class</span> <span class="cls">Solution</span>:`,
          `    <span class="kw">def</span> <span class="fn">maxDepth</span>(<span class="self">self</span>, root: Optional[TreeNode]) -&gt; int:`,
          `        <span class="kw">if not</span> root: <span class="kw">return</span> <span class="kw">0</span>`,
          `        stack = [(root, <span class="kw">1</span>)]`,
          `        max_d = <span class="kw">0</span>`,
          `        <span class="kw">while</span> stack:`,
          `            node, depth = stack.pop()`,
          `            max_d = max(max_d, depth)`,
          `            <span class="kw">if</span> node.left: stack.append((node.left, depth + <span class="kw">1</span>))`,
          `            <span class="kw">if</span> node.right: stack.append((node.right, depth + <span class="kw">1</span>))`,
          `        <span class="kw">return</span> max_d`
        ]
      }
    ];

    const presets = [
      { input: [3, 9, 20, null, null, 15, 7], output: 3, name: "Example 1" },
      { input: [1, null, 2], output: 2, name: "Example 2" },
      { input: [], output: 0, name: "Example 3" }
    ];

    let currentApproach = 0;
    let currentPreset = 0;
    let stepIdx = 0;
    let history = [];

    function switchApproach(idx) {
      currentApproach = idx;
      document.querySelectorAll('.app-tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
      renderApproachDetails();
      reset();
    }

    function setPreset(idx) {
      currentPreset = idx;
      document.querySelectorAll('.tabs .tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
      renderExample();
      reset();
    }

    function renderApproachDetails() {
      const app = approaches[currentApproach];
      document.getElementById('time-comp').innerText = app.time;
      document.getElementById('space-comp').innerText = app.space;
      document.getElementById('approach-desc').innerHTML = app.desc;
      document.getElementById('code-box').innerHTML = app.code.map((l, i) => `<div class="code-line" id="l${i}">${l}</div>`).join('');
    }

    function renderExample() {
      const p = presets[currentPreset];
      document.getElementById('ex-display').innerHTML = `
        <div><b>${p.name}:</b></div>
        <div>Input: root = [${p.input.map(v => v === null ? 'null' : v).join(', ')}]</div>
        <div>Output: ${p.output}</div>
      `;
    }

    function createTree(arr) {
      if (!arr || arr.length === 0) return null;
      let nodes = arr.map(v => v !== null ? { val: v, left: null, right: null, id: Math.random().toString(36).substr(2, 5) } : null);
      for (let i = 0; i < nodes.length; i++) {
        if (nodes[i]) {
          let leftIdx = 2 * i + 1;
          let rightIdx = 2 * i + 2;
          if (leftIdx < nodes.length) nodes[i].left = nodes[leftIdx];
          if (rightIdx < nodes.length) nodes[i].right = nodes[rightIdx];
        }
      }
      return nodes[0];
    }

    function renderTreeSVG(root, activeId = null, returningIds = [], visitedIds = []) {
      if (!root) {
        return `<div class="tree-container" style="color:var(--text-dim); font-family:monospace;">Tree is empty (None)</div>`;
      }

      let posMap = {};
      function calcPos(node, depth = 0, leftBound = 0, rightBound = 100) {
        if (!node) return;
        let x = (leftBound + rightBound) / 2;
        let y = depth * 50 + 30;
        posMap[node.id] = { x, y, val: node.val, left: node.left, right: node.right };
        calcPos(node.left, depth + 1, leftBound, x);
        calcPos(node.right, depth + 1, x, rightBound);
      }
      calcPos(root);

      let edgesHTML = '';
      let nodesHTML = '';

      Object.keys(posMap).forEach(id => {
        let p = posMap[id];
        let isAct = (id === activeId);
        let isRet = returningIds.includes(id);
        let isVis = visitedIds.includes(id);

        if (p.left && posMap[p.left.id]) {
          let lp = posMap[p.left.id];
          let edgeClass = (isAct || isRet) ? 'tree-edge active' : 'tree-edge';
          edgesHTML += `<line x1="${p.x}%" y1="${p.y}" x2="${lp.x}%" y2="${lp.y}" class="${edgeClass}" />`;
        }
        if (p.right && posMap[p.right.id]) {
          let rp = posMap[p.right.id];
          let edgeClass = (isAct || isRet) ? 'tree-edge active' : 'tree-edge';
          edgesHTML += `<line x1="${p.x}%" y1="${p.y}" x2="${rp.x}%" y2="${rp.y}" class="${edgeClass}" />`;
        }

        let circleClass = 'tree-node-circle';
        if (isVis) circleClass += ' visited';
        if (isRet) circleClass += ' returning';
        if (isAct) circleClass += ' active';

        nodesHTML += `
          <g>
            <circle cx="${p.x}%" cy="${p.y}" r="15" class="${circleClass}" />
            <text x="${p.x}%" y="${p.y}" class="tree-text">${p.val}</text>
          </g>
        `;
      });

      return `
        <div class="tree-container">
          <svg class="tree-svg">
            ${edgesHTML}
            ${nodesHTML}
          </svg>
        </div>
      `;
    }

    function renderCallStack(stack) {
      let html = `<div class="stack-container">`;
      html += `<div class="stack-title"><span>RECURSION CALL STACK</span><span>Depth: ${stack.length}</span></div>`;
      html += `<div class="stack-list" id="stack-list-body">`;
      
      if (stack.length === 0) {
        html += `<div style="font-size:0.75rem; color:#666; font-family:monospace; text-align:center; margin-auto:0;">(Stack is empty)</div>`;
      } else {
        stack.forEach((frame, idx) => {
          let isTop = (idx === stack.length - 1);
          let frameClass = 'stack-frame' + (isTop ? ' active top' : '');
          html += `
            <div class="${frameClass}">
              <span>maxDepth(node=${frame.val !== 'None' ? frame.val : 'None'})</span>
              <span style="color:${isTop ? 'var(--orange)' : 'var(--text-dim)'}">${frame.status}</span>
            </div>
          `;
        });
      }

      html += `</div></div>`;
      return html;
    }

    function buildSteps() {
      history = [];
      const input = presets[currentPreset].input;

      if (!input || input.length === 0) {
        let nullLine = (currentApproach === 0) ? 3 : (currentApproach === 1) ? 5 : (currentApproach === 2) ? 4 : 2;
        history.push({
          line: nullLine, phase: "檢查邊界條件", desc: "輸入樹為空 (root is None)，最大深度為 0。",
          html: `<div style="font-family:monospace; color:var(--text-dim); text-align:center; padding-top:100px; font-size:1.1rem;">Max Depth = 0</div>`
        });
        return;
      }

      // ----------------------------------------------------
      // Approach 0: DFS Recursive (Bottom-up)
      // ----------------------------------------------------
      if (currentApproach === 0) {
        let treeRoot = createTree(input);
        let visited = [];
        let callStack = [];

        function dfsBottomUp(node) {
          if (!node) {
            callStack.push({ val: 'None', status: 'Return 0' });
            history.push({
              line: 3, phase: "Base Case (空節點)",
              desc: "到達 None 節點，返回深度 0。",
              html: renderTreeSVG(treeRoot, null, [], visited) + renderCallStack(callStack)
            });
            callStack.pop();
            return 0;
          }

          callStack.push({ val: node.val, status: 'Entering...' });
          history.push({
            line: 2, phase: `DFS 訪問節點 [${node.val}]`,
            desc: `Call Stack 壓入 maxDepth(${node.val})。`,
            html: renderTreeSVG(treeRoot, node.id, [], visited) + renderCallStack(callStack)
          });

          callStack[callStack.length - 1].status = 'Exploring Left';
          history.push({
            line: 5, phase: `求解左子樹深度 maxDepth(node.left)`,
            desc: `節點 [${node.val}] 遞迴求解左子樹深度。`,
            html: renderTreeSVG(treeRoot, node.id, [], visited) + renderCallStack(callStack)
          });
          let leftD = dfsBottomUp(node.left);

          callStack[callStack.length - 1].status = `Left=${leftD}, Exploring Right`;
          history.push({
            line: 6, phase: `求解右子樹深度 maxDepth(node.right)`,
            desc: `節點 [${node.val}] 左子樹深度為 ${leftD}，接著遞迴求解右子樹深度。`,
            html: renderTreeSVG(treeRoot, node.id, [], visited) + renderCallStack(callStack)
          });
          let rightD = dfsBottomUp(node.right);

          let curMax = 1 + Math.max(leftD, rightD);
          visited.push(node.id);

          callStack[callStack.length - 1].status = `L=${leftD}, R=${rightD} => Depth=${curMax}`;
          history.push({
            line: 8, phase: `計算節點 [${node.val}] 深度`,
            desc: `1 + max(left=${leftD}, right=${rightD}) = ${curMax}，準備返回。`,
            html: renderTreeSVG(treeRoot, node.id, [node.id], visited) + renderCallStack(callStack)
          });

          callStack.pop();
          return curMax;
        }

        let totalDepth = dfsBottomUp(treeRoot);

        history.push({
          line: 8, phase: "計算完成",
          desc: `整棵二元樹的最大深度為 ${totalDepth}！`,
          html: renderTreeSVG(treeRoot, treeRoot.id, [], visited) + renderCallStack(callStack)
        });
      }

      // ----------------------------------------------------
      // Approach 1: DFS Recursive (Top-down)
      // ----------------------------------------------------
      else if (currentApproach === 1) {
        let treeRoot = createTree(input);
        let visited = [];
        let callStack = [];
        let globalMax = 0;

        history.push({
          line: 2, phase: "初始化全局最大深度",
          desc: "設定 self.max_d = 0，準備從根節點展開 Top-down DFS。",
          html: renderTreeSVG(treeRoot, null, [], visited) + 
                `<div class="ds-display"><span>Global max_d = ${globalMax}</span></div>`
        });

        function dfsTopDown(node, currentDepth) {
          if (!node) {
            callStack.push({ val: 'None', status: 'Return (Base)' });
            history.push({
              line: 5, phase: "Base Case (空節點)",
              desc: "遇到空節點，結束當前分支遞迴。",
              html: renderTreeSVG(treeRoot, null, [], visited) + renderCallStack(callStack)
            });
            callStack.pop();
            return;
          }

          callStack.push({ val: node.val, status: `depth = ${currentDepth}` });
          globalMax = Math.max(globalMax, currentDepth);
          visited.push(node.id);

          history.push({
            line: 6, phase: `到達節點 [${node.val}] (Depth=${currentDepth})`,
            desc: `更新全局最大深度 self.max_d = max(${globalMax}, ${currentDepth}) = ${globalMax}`,
            html: renderTreeSVG(treeRoot, node.id, [], visited) + renderCallStack(callStack)
          });

          callStack[callStack.length - 1].status = `depth=${currentDepth}, go Left`;
          history.push({
            line: 7, phase: `深入左子樹 (Depth=${currentDepth + 1})`,
            desc: `呼叫 dfs(node.left, ${currentDepth + 1})`,
            html: renderTreeSVG(treeRoot, node.id, [], visited) + renderCallStack(callStack)
          });
          dfsTopDown(node.left, currentDepth + 1);

          callStack[callStack.length - 1].status = `depth=${currentDepth}, go Right`;
          history.push({
            line: 8, phase: `深入右子樹 (Depth=${currentDepth + 1})`,
            desc: `呼叫 dfs(node.right, ${currentDepth + 1})`,
            html: renderTreeSVG(treeRoot, node.id, [], visited) + renderCallStack(callStack)
          });
          dfsTopDown(node.right, currentDepth + 1);

          callStack.pop();
        }

        dfsTopDown(treeRoot, 1);

        history.push({
          line: 11, phase: "DFS 搜尋結束",
          desc: `走訪完畢，返回最終算出的最大深度 max_d = ${globalMax}。`,
          html: renderTreeSVG(treeRoot, treeRoot.id, [], visited) + 
                `<div class="ds-display"><span>Final Maximum Depth = ${globalMax}</span></div>`
        });
      }

      // ----------------------------------------------------
      // Approach 2: BFS Iterative (Level Order)
      // ----------------------------------------------------
      else if (currentApproach === 2) {
        let treeRoot = createTree(input);
        let queue = [treeRoot];
        let depth = 0;
        let visited = [];

        history.push({
          line: 5, phase: "初始化 Queue",
          desc: "將 root 加入 Queue，初始化 depth = 0。",
          html: renderTreeSVG(treeRoot, treeRoot.id, [], visited) + 
                `<div class="ds-display"><span>Current Depth = ${depth}</span><span>Queue: [${queue.map(n=>n.val).join(', ')}]</span></div>`
        });

        while (queue.length > 0) {
          depth++;
          let levelSize = queue.length;

          history.push({
            line: 8, phase: `進入第 ${depth} 層走訪`,
            desc: `depth 增加為 ${depth}，當前層共有 ${levelSize} 個節點。`,
            html: renderTreeSVG(treeRoot, null, queue.map(n=>n.id), visited) + 
                  `<div class="ds-display"><span>Current Depth = ${depth}</span><span>Queue Size = ${levelSize}</span></div>`
          });

          for (let i = 0; i < levelSize; i++) {
            let node = queue.shift();
            visited.push(node.id);

            history.push({
              line: 10, phase: `Pop 處理節點 [${node.val}]`,
              desc: `從 Queue 取出節點 [${node.val}]，將其非空子節點加入 Queue。`,
              html: renderTreeSVG(treeRoot, node.id, [], visited) + 
                    `<div class="ds-display"><span>Current Depth = ${depth}</span><span>Processing: [${node.val}]</span></div>`
            });

            if (node.left) queue.push(node.left);
            if (node.right) queue.push(node.right);
          }
        }

        history.push({
          line: 13, phase: "BFS 走訪完成",
          desc: `Queue 已為空，總共走訪了 ${depth} 層，最大深度為 ${depth}。`,
          html: renderTreeSVG(treeRoot, treeRoot.id, [], visited) + 
                `<div class="ds-display"><span>Final Depth = ${depth}</span><span>Queue: []</span></div>`
        });
      }

      // ----------------------------------------------------
      // Approach 3: DFS Iterative (Stack)
      // ----------------------------------------------------
      else if (currentApproach === 3) {
        let treeRoot = createTree(input);
        let stack = [{ node: treeRoot, depth: 1 }];
        let max_d = 0;
        let visited = [];

        history.push({
          line: 3, phase: "初始化 Stack",
          desc: "將 (root, depth=1) 推入 Stack，設定 max_d = 0。",
          html: renderTreeSVG(treeRoot, treeRoot.id, [], visited) + 
                `<div class="ds-display"><span>max_d = ${max_d}</span><span>Stack: [(val:${treeRoot.val}, d:1)]</span></div>`
        });

        while (stack.length > 0) {
          let { node, depth } = stack.pop();
          max_d = Math.max(max_d, depth);
          visited.push(node.id);

          history.push({
            line: 7, phase: `從 Stack 彈出節點 [${node.val}]`,
            desc: `彈出節點 [${node.val}] (Depth=${depth})，更新 max_d = max(${max_d}, ${depth}) = ${max_d}`,
            html: renderTreeSVG(treeRoot, node.id, [node.id], visited) + 
                  `<div class="ds-display"><span>Current max_d = ${max_d}</span><span>Stack Size = ${stack.length}</span></div>`
          });

          if (node.left) {
            stack.push({ node: node.left, depth: depth + 1 });
          }
          if (node.right) {
            stack.push({ node: node.right, depth: depth + 1 });
          }

          history.push({
            line: 9, phase: `將子節點壓入 Stack`,
            desc: `將 [${node.val}] 的子節點及其對應深度 (${depth + 1}) 壓入 Stack 中。`,
            html: renderTreeSVG(treeRoot, node.id, [], visited) + 
                  `<div class="ds-display"><span>Current max_d = ${max_d}</span><span>Stack: [${stack.map(item => `(${item.node.val}, d:${item.depth})`).join(', ')}]</span></div>`
          });
        }

        history.push({
          line: 11, phase: "DFS 迭代結束",
          desc: `Stack 已清空，計算出的最大深度為 ${max_d}。`,
          html: renderTreeSVG(treeRoot, treeRoot.id, [], visited) + 
                `<div class="ds-display"><span>Final Maximum Depth = ${max_d}</span></div>`
        });
      }
    }

    function applyState() {
      const state = history[stepIdx] || {};
      document.getElementById('prev-btn').disabled = (stepIdx === 0);
      document.getElementById('next-btn').disabled = (stepIdx === history.length - 1);

      document.querySelectorAll('.code-line').forEach(l => l.classList.remove('active'));
      const activeEl = document.getElementById('l' + (state.line || 0));
      if (activeEl) activeEl.classList.add('active');

      document.getElementById('stepHint').innerText = `STEP ${stepIdx + 1}/${history.length}`;
      document.getElementById('val-phase').innerText = state.phase || "-";
      document.getElementById('val-desc').innerText = state.desc || "-";

      const stageBox = document.getElementById('stage-box');
      stageBox.innerHTML = state.html || `<div style="font-size:0.85rem; font-family:monospace; color:#fff;">${state.desc}</div>`;

      const stackList = document.getElementById('stack-list-body');
      if (stackList) {
        stackList.scrollTop = stackList.scrollHeight;
      }
    }

    function reset() {
      stepIdx = 0;
      buildSteps();
      applyState();
    }

    function step(dir) {
      if (stepIdx + dir >= 0 && stepIdx + dir < history.length) {
        stepIdx += dir;
        applyState();
      }
    }

    window.onload = () => {
      renderApproachDetails();
      renderExample();
      reset();
    };
  </script>
</body>
</html>
