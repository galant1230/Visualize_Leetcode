<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>207. Course Schedule Lab</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600;700&display=swap');
        :root { --vs-bg: #1E1E1E; --vs-sidebar: #252526; --vs-border: #3C3C3C; }
        body { background-color: var(--vs-bg); color: #D4D4D4; font-family: 'Inter', sans-serif; margin: 0; height: 100vh; overflow: hidden; }
        .code-font { font-family: 'Fira Code', monospace; }
        .kw { color: #C586C0; } .fn { color: #DCDCAA; } .st { color: #CE9178; } .cn { color: #569CD6; } .co { color: #6A9955; }
        .active-line { background-color: #37373D; border-left: 3px solid #007ACC; transition: all 0.2s; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #454545; border-radius: 10px; }
        .node-u { filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.8)); stroke: #3B82F6 !important; stroke-width: 4px !important; }
        .node-v { filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.5)); stroke: #F59E0B !important; }
        .arrow-flow { stroke-dasharray: 5; animation: dash 0.8s linear infinite; stroke: #3B82F6 !important; stroke-width: 3px !important; }
        @keyframes dash { from { stroke-dashoffset: 10; } to { stroke-dashoffset: 0; } }
        .btn-ctrl { @apply w-10 h-10 flex items-center justify-center rounded-lg hover:bg-white/10 transition-colors disabled:opacity-20; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 使用 Example 2 作為預設演示，因為環偵測更有教育意義
        const NUM_COURSES = 2;
        const PREREQS = [[1, 0], [0, 1]]; 

        const CODE_SNIPPET = [
            { t: "class Solution:", i: 0 },
            { t: "    def canFinish(self, numCourses, prerequisites):", i: 1 },
            { t: "        adj = [[] for _ in range(numCourses)]", i: 2 },
            { t: "        indegree = [0] * numCourses", i: 2 },
            { t: "        for dest, src in prerequisites:", i: 2 },
            { t: "            adj[src].append(dest)", i: 3 },
            { t: "            indegree[dest] += 1", i: 3 },
            { t: "        queue = deque([i for i in range(numCourses) if indegree[i] == 0])", i: 2 },
            { t: "        count = 0", i: 2 },
            { t: "        while queue:", i: 2 },
            { t: "            u = queue.popleft()", i: 3 },
            { t: "            count += 1", i: 3 },
            { t: "            for v in adj[u]:", i: 3 },
            { t: "                indegree[v] -= 1", i: 4 },
            { t: "                if indegree[v] == 0: queue.append(v)", i: 4 },
            { t: "        return count == numCourses", i: 2 }
        ];

        const highlight = (text) => {
            return text.replace(/\b(class|def|if|elif|not|return|for|in|range|self|while)\b/g, '<span class="kw">$1</span>')
                       .replace(/\b(canFinish|append|popleft)\b/g, '<span class="fn">$1</span>')
                       .replace(/\b(adj|indegree|queue|count|u|v|numCourses)\b/g, '<span class="cn">$1</span>');
        };

        const App = () => {
            const [cur, setCur] = useState(0);
            const [playing, setPlaying] = useState(false);
            const [steps, setSteps] = useState([]);
            const logEndRef = useRef(null);

            const generateSteps = () => {
                const history = [];
                const adj = Array.from({ length: NUM_COURSES }, () => []);
                const indegree = Array(NUM_COURSES).fill(0);
                let count = 0;
                const queue = [];
                const log = (line, msg, u = null, v = null) => {
                    history.push({ line, msg, u, v, adj: adj.map(a => [...a]), indegree: [...indegree], count, queue: [...queue] });
                };

                log(2, "初始化資料結構");
                for (const [dest, src] of PREREQS) {
                    adj[src].push(dest);
                    indegree[dest]++;
                    log(5, `建立關係 ${src} -> ${dest}，課程 ${dest} 入度+1`);
                }

                for (let i = 0; i < NUM_COURSES; i++) {
                    if (indegree[i] === 0) {
                        queue.push(i);
                        log(7, `課程 ${i} 入度為 0，加入 Queue`);
                    }
                }
                if (queue.length === 0) log(7, "⚠️ 沒有任何課程入度為 0！環偵測啟動。");

                while (queue.length > 0) {
                    const u = queue.shift();
                    log(10, `取出 u=${u}`, u);
                    count++;
                    log(11, `修課總數 count 變更為 ${count}`, u);

                    for (const v of adj[u]) {
                        log(12, `檢查後續課程 v=${v}`, u, v);
                        indegree[v]--;
                        log(13, `v=${v} 入度減 1，剩餘 ${indegree[v]}`, u, v);
                        if (indegree[v] === 0) {
                            queue.push(v);
                            log(14, `v=${v} 入度歸零，加入 Queue`, u, v);
                        }
                    }
                }
                log(15, count === NUM_COURSES ? "成功！所有課程皆可完成。" : "失敗！偵測到環，無法完成修課。");
                return history;
            };

            useEffect(() => { setSteps(generateSteps()); }, []);
            useEffect(() => {
                if (playing) {
                    const t = setInterval(() => setCur(v => v < steps.length - 1 ? v + 1 : (setPlaying(false), v)), 1200);
                    return () => clearInterval(t);
                }
            }, [playing, steps]);

            const s = steps[cur] || { adj: [[],[]], indegree: [0,0], count: 0, queue: [], line: 0, msg: "", u: null, v: null };
            const positions = [[120, 150], [380, 150]];

            return (
                <div className="flex h-screen w-screen overflow-hidden bg-[#1E1E1E]">
                    {/* LEFT PANEL: Detailed Info */}
                    <div className="w-[28%] bg-[#252526] border-r border-[#3C3C3C] flex flex-col p-6 overflow-y-auto custom-scroll">
                        <div className="space-y-6">
                            <section>
                                <h1 className="text-xl font-bold text-white mb-1 font-mono tracking-tight">207. Course Schedule</h1>
                                <div className="flex gap-2">
                                    <span className="text-[10px] px-1.5 py-0.5 bg-yellow-500/10 text-yellow-500 rounded font-bold border border-yellow-500/20">MEDIUM</span>
                                    <span className="text-[10px] px-1.5 py-0.5 bg-blue-500/10 text-blue-500 rounded font-bold border border-blue-500/20">GRAPH</span>
                                </div>
                            </section>

                            <section>
                                <h3 className="text-[10px] text-gray-500 font-bold uppercase mb-2 border-b border-white/5 pb-1">題目敘述</h3>
                                <p className="text-[12px] text-gray-300 leading-relaxed">
                                    現在總共有 <code className="text-blue-400 font-mono italic">n</code> 門課程需要修，標記為 0 到 n-1。<br/>
                                    給定一個先修課程陣列 <code className="text-blue-400 font-mono italic">prerequisites</code>，
                                    其中 [a, b] 表示如果你想修課程 a，你**必須**先修完課程 b。<br/>
                                    請判斷是否可能完成所有課程。
                                </p>
                            </section>

                            <section>
                                <h3 className="text-[10px] text-gray-500 font-bold uppercase mb-2 border-b border-white/5 pb-1">範例測資 (目前顯示)</h3>
                                <div className="bg-black/30 p-3 rounded font-mono text-[11px] text-orange-200 shadow-inner space-y-2">
                                    <div>
                                        <div className="text-gray-500 text-[9px] mb-1">// Example 2: Cycle Case</div>
                                        numCourses = 2, prereqs = [[1,0],[0,1]]<br/>
                                        <span className="text-red-400">Output: false</span>
                                    </div>
                                </div>
                            </section>

                            <section>
                                <h3 className="text-[10px] text-gray-500 font-bold uppercase mb-2 border-b border-white/5 pb-1">解法詳解 (Kahn's Algorithm)</h3>
                                <ul className="text-[11px] text-gray-400 space-y-2 list-disc ml-4">
                                    <li>這是一個 <span className="text-white">DAG (有向無環圖)</span> 的拓撲排序。</li>
                                    <li><b className="text-blue-400">入度 (Indegree):</b> 紀錄每門課還有多少先修課沒修。</li>
                                    <li><b className="text-blue-400">鄰接表 (Adj):</b> 紀錄修完這門課後「解鎖」了哪些後續課程。</li>
                                    <li><b className="text-blue-400">核心:</b> 每次只修入度為 0 (沒有任何阻礙) 的課。</li>
                                </ul>
                            </section>

                            <section className="bg-white/5 p-3 rounded border border-white/5 shadow-inner">
                                <h3 className="text-[10px] text-gray-500 font-bold uppercase mb-3">複雜度分析 Complexity</h3>
                                <div className="grid grid-cols-2 gap-4 text-center">
                                    <div>
                                        <div className="text-[10px] text-gray-500 uppercase">Time</div>
                                        <div className="text-blue-400 font-bold font-mono text-lg">O(V + E)</div>
                                    </div>
                                    <div>
                                        <div className="text-[10px] text-gray-500 uppercase">Space</div>
                                        <div className="text-blue-400 font-bold font-mono text-lg">O(V + E)</div>
                                    </div>
                                </div>
                            </section>
                        </div>
                    </div>

                    {/* MIDDLE PANEL: Visualization */}
                    <div className="flex-1 flex flex-col p-6 gap-4 bg-[#1A1A1A]">
                        <div className="flex-1 bg-[#252526] rounded-xl border border-[#3C3C3C] flex flex-col shadow-2xl relative">
                            <div className="p-4 border-b border-white/5 bg-black/10 flex justify-between items-center font-mono text-[10px] uppercase">
                                <span className="text-blue-500 font-bold tracking-widest">Cycle Detection View</span>
                                <div className="text-orange-400 font-bold">{s.msg}</div>
                            </div>
                            
                            <div className="flex-1 flex items-center justify-center relative">
                                <svg width="500" height="300">
                                    <defs>
                                        <marker id="arrow" markerWidth="10" markerHeight="7" refX="22" refY="3.5" orient="auto">
                                            <polygon points="0 0, 10 3.5, 0 7" fill="#4B5563" />
                                        </marker>
                                    </defs>
                                    {PREREQS.map(([dest, src], i) => (
                                        <line key={i} x1={positions[src][0]} y1={positions[src][1]} x2={positions[dest][0]} y2={positions[dest][1]} 
                                              stroke={s.u === src && s.v === dest ? "#3B82F6" : "#3C3C3C"} strokeWidth="2" markerEnd="url(#arrow)" 
                                              className={s.u === src && s.v === dest ? "arrow-flow" : ""} />
                                    ))}
                                    {positions.map((pos, i) => (
                                        <g key={i} className={`${s.u === i ? "node-u" : ""} ${s.v === i ? "node-v" : ""}`}>
                                            <circle cx={pos[0]} cy={pos[1]} r="24" 
                                                    fill={s.indegree[i] === 0 ? "#064E3B" : "#252526"} 
                                                    stroke={s.u === i ? "#3B82F6" : (s.v === i ? "#F59E0B" : "#3C3C3C")} strokeWidth="2" />
                                            <text x={pos[0]} y={pos[1]+5} textAnchor="middle" fill="white" className="font-bold font-mono">C{i}</text>
                                        </g>
                                    ))}
                                </svg>
                                
                                <div className="absolute top-4 right-4 bg-black/30 p-4 rounded border border-white/5 font-mono">
                                    <div className="text-[10px] text-gray-500 uppercase mb-2 italic">Variable Watch</div>
                                    <div className="space-y-1">
                                        <div className="flex justify-between gap-6"><span className="text-gray-400">u (Active)</span> <span className="text-blue-400">{s.u !== null ? s.u : 'None'}</span></div>
                                        <div className="flex justify-between gap-6"><span className="text-gray-400">v (Target)</span> <span className="text-orange-400">{s.v !== null ? s.v : 'None'}</span></div>
                                        <div className="flex justify-between gap-6"><span className="text-gray-400">count</span> <span className="text-green-400 font-bold">{s.count}</span></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* PLAYBACK CONTROLLER */}
                        <div className="h-20 bg-[#252526] rounded-xl border border-[#3C3C3C] flex items-center px-8 gap-10">
                            <div className="flex items-center gap-2">
                                <button onClick={() => setCur(0)} className="btn-ctrl"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg></button>
                                <button onClick={() => setPlaying(!playing)} className="w-12 h-12 flex items-center justify-center rounded-full bg-blue-600 text-white shadow-lg">
                                    {playing ? <svg width="20" height="20" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> : <svg width="20" height="20" fill="currentColor" className="ml-1"><path d="M8 5v14l11-7z"/></svg>}
                                </button>
                                <button onClick={() => setCur(v => Math.min(steps.length-1, v+1))} className="btn-ctrl"><svg width="20" height="20" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button>
                            </div>
                            <div className="flex-1 flex flex-col gap-2">
                                <div className="flex justify-between text-[10px] font-mono uppercase">
                                    <span className="text-gray-500">Execution Progress</span>
                                    <span className="text-blue-500 font-bold">{cur + 1} / {steps.length}</span>
                                </div>
                                <div className="h-2 w-full bg-black/50 rounded-full overflow-hidden border border-white/5">
                                    <div className="h-full bg-blue-500 transition-all duration-300 shadow-[0_0_10px_rgba(59,130,246,0.5)]" style={{width:`${((cur+1)/steps.length)*100}%`}}></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* RIGHT PANEL: Data Structures */}
                    <div className="w-[30%] border-l border-[#3C3C3C] flex flex-col bg-[#1E1E1E]">
                        <div className="h-[40%] flex flex-col">
                            <div className="h-9 bg-[#252526] border-b border-[#3C3C3C] flex items-center px-4 font-mono text-[9px] text-gray-500 uppercase">Code Monitor</div>
                            <div className="flex-1 overflow-y-auto custom-scroll p-2">
                                {CODE_SNIPPET.map((line, i) => (
                                    <div key={i} className={`flex min-h-[1.4rem] items-center ${s.line === i ? 'active-line' : ''}`}>
                                        <span className="w-5 text-right pr-2 text-gray-700 text-[9px] font-mono">{i+1}</span>
                                        <pre className="text-[10px] code-font" style={{ marginLeft: `${line.i * 1.2}rem` }} dangerouslySetInnerHTML={{ __html: highlight(line.t) }} />
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="h-[60%] border-t border-[#3C3C3C] flex flex-col p-4 bg-[#1A1A1A]">
                            <div className="grid grid-cols-2 gap-3 mb-4">
                                <div className="bg-[#252526] p-2 rounded-lg border border-white/5">
                                    <h4 className="text-[8px] text-gray-500 font-bold uppercase mb-1">adj List</h4>
                                    <div className="text-[10px] font-mono text-gray-400">
                                        {s.adj.map((n, i) => (
                                            <div key={i} className={s.u === i ? "text-blue-400" : ""}>{i}: [{n.join(',')}]</div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-[#252526] p-2 rounded-lg border border-white/5">
                                    <h4 className="text-[8px] text-gray-500 font-bold uppercase mb-1">Queue / Indegree</h4>
                                    <div className="text-[10px] font-mono">
                                        <div className="text-blue-400 mb-1">Q: [{s.queue.join(',')}]</div>
                                        <div className="flex gap-1.5">
                                            {s.indegree.map((v, i) => (
                                                <div key={i} className="flex flex-col items-center">
                                                    <span className={`text-[10px] ${s.v === i ? 'text-orange-400 font-bold underline' : 'text-gray-500'}`}>{v}</span>
                                                    <span className="text-[7px] text-gray-700">C{i}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="flex-1 bg-black/30 rounded-lg p-3 font-mono text-[10px] overflow-y-auto custom-scroll border border-white/5 relative shadow-inner">
                                <h4 className="text-[9px] text-gray-600 font-bold uppercase mb-2">Live Debug Log</h4>
                                {steps.slice(0, cur + 1).map((step, idx) => (
                                    <div key={idx} className={`mb-1 pl-2 border-l transition-all ${idx === cur ? 'border-blue-500 text-blue-300' : 'border-transparent text-gray-600'}`}>
                                        {step.msg}
                                    </div>
                                ))}
                                <div ref={logEndRef} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
