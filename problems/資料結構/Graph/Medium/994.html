<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>994. Rotting Oranges - BFS Lab</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600;700&display=swap');
        :root { --vs-bg: #1E1E1E; --vs-sidebar: #252526; --vs-border: #3C3C3C; --vs-active: #37373D; }
        body { background-color: var(--vs-bg); color: #D4D4D4; font-family: 'Inter', sans-serif; margin: 0; height: 100vh; overflow: hidden; }
        .code-font { font-family: 'Fira Code', monospace; }
        .kw { color: #C586C0; } .fn { color: #DCDCAA; } .st { color: #CE9178; } .cn { color: #569CD6; } .co { color: #6A9955; }
        .active-line { background-color: #3e3e42; border-left: 3px solid #007ACC; }
        .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #454545; border-radius: 10px; }
        
        /* 網格動畫 */
        .cell-anim { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .cell-pop { animation: pop 0.4s ease-out; }
        @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        
        /* 腐爛擴散動畫 */
        .cell-rot { animation: rot-flash 0.6s ease-out; }
        @keyframes rot-flash { 0% { background-color: rgba(251, 146, 60, 0.6); transform: scale(1.1); box-shadow: 0 0 15px #fb923c; } 100% { background-color: rgba(251, 146, 60, 0.2); transform: scale(1); box-shadow: none; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const GRID_INIT = [
            [2, 1, 1],
            [1, 1, 0],
            [0, 1, 1]
        ];

        const CODE_SNIPPET = [
            { t: "class Solution:", i: 0 },
            { t: "    def orangesRotting(self, grid: List[List[int]]) -> int:", i: 1 },
            { t: "        R, C = len(grid), len(grid[0])", i: 2 },
            { t: "        q = collections.deque()", i: 2 },
            { t: "        fresh = 0", i: 2 },
            { t: "        # 初始化：加入所有腐爛橘子，統計新鮮橘子", i: 2 },
            { t: "        for r in range(R):", i: 2 },
            { t: "            for c in range(C):", i: 3 },
            { t: "                if grid[r][c] == 2: q.append((r, c))", i: 4 },
            { t: "                elif grid[r][c] == 1: fresh += 1", i: 4 },
            { t: "        if fresh == 0: return 0", i: 2 },
            { t: "        minutes = -1", i: 2 },
            { t: "        while q:", i: 2 },
            { t: "            minutes += 1", i: 3 },
            { t: "            for _ in range(len(q)): # 處理當前層", i: 3 },
            { t: "                r, c = q.popleft()", i: 4 },
            { t: "                for dr, dc in [(0,1),(0,-1),(1,0),(-1,0)]:", i: 4 },
            { t: "                    nr, nc = r+dr, c+dc", i: 5 },
            { t: "                    if 0<=nr<R and 0<=nc<C and grid[nr][nc]==1:", i: 5 },
            { t: "                        grid[nr][nc] = 2; fresh -= 1", i: 6 },
            { t: "                        q.append((nr, nc))", i: 6 },
            { t: "        return minutes if fresh == 0 else -1", i: 2 }
        ];

        const highlight = (text) => {
            return text.replace(/\b(class|def|if|elif|not|return|for|in|while|range|self)\b/g, '<span class="kw">$1</span>')
                       .replace(/\b(orangesRotting|len|append|popleft)\b/g, '<span class="fn">$1</span>')
                       .replace(/'[^']*'|#.*$/g, (m) => m.startsWith('#') ? `<span class="co">${m}</span>` : `<span class="st">${m}</span>`)
                       .replace(/\b(grid|R|C|q|fresh|minutes|r|c|dr|dc|nr|nc)\b/g, '<span class="cn">$1</span>');
        };

        const App = () => {
            const [cur, setCur] = useState(0);
            const [playing, setPlaying] = useState(false);
            const [steps, setSteps] = useState([]);
            const timer = useRef(null);

            const generateSteps = (gridInput) => {
                const history = [];
                const grid = gridInput.map(row => [...row]);
                const R = grid.length, C = grid[0].length;
                let q = [];
                let freshCount = 0;

                const log = (line, r, c, min, fCount, msg, animPos=null) => {
                    history.push({
                        line, r, c, minutes: min, freshCount: fCount, qSnap: [...q], msg, animPos,
                        grid: grid.map(row => [...row])
                    });
                };

                // Step 1: 初始化
                log(4, null, null, 0, freshCount, "初始化變數", null);
                for (let r = 0; r < R; r++) {
                    for (let c = 0; c < C; c++) {
                        if (grid[r][c] === 2) {
                            q.push([r, c]);
                            log(8, r, c, 0, freshCount, `發現腐爛橘子(${r}, ${c})，加入隊列`);
                        } else if (grid[r][c] === 1) {
                            freshCount++;
                            log(9, r, c, 0, freshCount, `統計新鮮橘子(${r}, ${c})`);
                        }
                    }
                }

                if (freshCount === 0) {
                    log(10, null, null, 0, 0, "無新鮮橘子，直接結束");
                    return history;
                }

                let minutes = -1;
                log(12, null, null, minutes, freshCount, "開始 BFS 層次遍歷");
                while (q.length > 0) {
                    minutes++;
                    log(13, null, null, minutes, freshCount, `時間增加為 ${minutes} 分鐘`);
                    
                    let layerSize = q.length;
                    log(14, null, null, minutes, freshCount, `處理當前層次，節點數: ${layerSize}`);
                    
                    for (let i = 0; i < layerSize; i++) {
                        const [r, c] = q.shift();
                        log(15, r, c, minutes, freshCount, `取出隊首 (${r}, ${c}) 準備擴散`);

                        for (const [dr, dc] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
                            const nr = r + dr, nc = c + dc;
                            
                            if (nr >= 0 && nr < R && nc >= 0 && nc < C && grid[nr][nc] === 1) {
                                grid[nr][nc] = 2; // 腐爛
                                freshCount--;
                                q.push([nr, nc]);
                                log(19, nr, nc, minutes, freshCount, `橘子(${nr}, ${nc}) 被感染！`, [nr, nc]);
                            }
                        }
                    }
                }
                log(21, null, null, minutes, freshCount, `隊列為空，BFS 結束`);
                return history;
            };

            useEffect(() => {
                setSteps(generateSteps(GRID_INIT));
                setCur(0);
            }, []);

            useEffect(() => {
                if (playing) {
                    timer.current = setInterval(() => {
                        setCur(v => v < steps.length - 1 ? v + 1 : (setPlaying(false), v));
                    }, 400);
                } else clearInterval(timer.current);
                return () => clearInterval(timer.current);
            }, [playing, steps]);

            const s = steps[cur] || { grid: GRID_INIT, line: 0, r: null, c: null, minutes: 0, freshCount: 0, qSnap: [], msg: "", animPos: null };

            return (
                <div className="flex h-screen w-screen overflow-hidden text-sm">
                    {/* LEFT PANEL: Problem & Logic */}
                    <div className="w-1/4 bg-[#252526] border-r border-[#3C3C3C] flex flex-col p-6 overflow-y-auto custom-scroll">
                        <h2 className="text-xl font-bold text-white mb-4 font-mono">994. Rotting Oranges</h2>
                        <div className="space-y-6">
                            <section>
                                <h3 className="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">Description</h3>
                                <div className="text-[12px] text-gray-400 bg-black/20 p-3 rounded border border-white/5 leading-relaxed">
                                    給定一個網格：<br/>
                                    • <code className="text-orange-400 font-bold">2</code>: 腐爛橘子<br/>
                                    • <code className="text-green-400 font-bold">1</code>: 新鮮橘子<br/>
                                    • <code className="text-gray-600 font-bold">0</code>: 空格<br/>
                                    每分鐘，腐爛橘子會將相鄰（四方向）的新鮮橘子感染。計算全部腐爛所需的最短分鐘數。
                                </div>
                            </section>
                            <section>
                                <h3 className="text-[10px] font-bold text-blue-400 uppercase tracking-widest mb-2">BFS 邏輯</h3>
                                <p className="text-[12px] text-gray-400 italic border-l-2 border-blue-500 pl-3">
                                    這是一個標準的<b>多源 BFS</b>。所有腐爛橘子同時擴散，每一層遍歷代表 1 分鐘。
                                </p>
                            </section>
                            <div className="mt-auto flex gap-2">
                                <span className="px-2 py-1 bg-blue-500/10 text-blue-400 rounded text-[10px] font-mono border border-blue-500/20">Time: O(MN)</span>
                                <span className="px-2 py-1 bg-green-500/10 text-green-400 rounded text-[10px] font-mono border border-green-500/20">Space: O(MN)</span>
                            </div>
                        </div>
                    </div>

                    {/* MIDDLE PANEL: Visualization */}
                    <div className="flex-1 flex flex-col p-6 bg-[#1E1E1E] gap-4">
                        <div className="flex-1 bg-[#252526] rounded-md border border-[#3C3C3C] flex flex-col shadow-2xl overflow-hidden relative">
                            <div className="p-4 border-b border-white/5 bg-black/10 flex justify-between font-mono">
                                <span className="text-[10px] text-orange-500 font-bold uppercase tracking-widest">Rotting Simulation Arena</span>
                                <div className="text-right flex gap-6 text-[10px]">
                                    <div><span className="text-gray-600 uppercase">Minutes</span> <span className="text-white font-bold">{s.minutes >= 0 ? s.minutes : 0}</span></div>
                                    <div><span className="text-gray-600 uppercase">Fresh Orange</span> <span className="text-green-400 font-bold">{s.freshCount}</span></div>
                                </div>
                            </div>
                            <div className="flex-1 flex flex-col items-center justify-center bg-[#1A1A1A]">
                                <div className="grid gap-2 bg-[#252526] p-6 rounded-xl border border-white/5 shadow-inner" style={{ gridTemplateColumns: `repeat(3, 80px)` }}>
                                    {s.grid.map((row, r) => row.map((cell, c) => {
                                        const isTarget = s.r === r && s.c === c;
                                        const isAnimating = s.animPos && s.animPos[0] === r && s.animPos[1] === c;
                                        const original = GRID_INIT[r][c];
                                        
                                        let bg = 'bg-[#1e1e1e]';
                                        let color = 'text-gray-700';
                                        let textValue = '';
                                        let animClass = "";

                                        if (cell === 2) {
                                            bg = 'bg-orange-950/40';
                                            color = 'text-orange-400';
                                            textValue = '2';
                                            if (original === 1) animClass = isAnimating ? "cell-rot cell-pop" : "cell-pop";
                                        } else if (cell === 1) {
                                            bg = 'bg-green-950/40';
                                            color = 'text-green-400 font-bold';
                                            textValue = '1';
                                        } else if (cell === 0) {
                                            bg = 'bg-transparent';
                                            color = 'text-gray-800 font-mono';
                                            textValue = '0';
                                        }

                                        let borderClass = 'border border-white/5';
                                        if (isTarget) borderClass = 'border-2 border-blue-500 scale-105 z-10 ring-2 ring-blue-500/50 shadow-2xl';
                                        
                                        return (
                                            <div key={`${r}-${c}`} className={`cell-anim aspect-square rounded-xl transition-all duration-300 flex flex-col items-center justify-center relative ${bg} ${borderClass} ${animClass}`}>
                                                <span className={`${color} text-2xl`}>{textValue}</span>
                                                <span className="text-[9px] text-gray-700 absolute bottom-1 right-1 font-mono">({r},{c})</span>
                                                {isTarget && <div className="absolute inset-0 border-2 border-blue-500 rounded-xl animate-pulse"></div>}
                                            </div>
                                        );
                                    }))}
                                </div>
                                <div className="mt-8 text-gray-300 font-mono text-xs italic bg-black/30 px-4 py-1 rounded-full border border-white/5">
                                    {`> ${s.msg}`}
                                </div>
                            </div>
                        </div>

                        {/* Player Controls */}
                        <div className="h-20 bg-[#252526] rounded-md border border-[#3C3C3C] flex items-center px-10 gap-8 shadow-xl">
                            <div className="flex gap-6">
                                <button onClick={() => { setPlaying(false); setCur(0); }} className="text-gray-500 hover:text-white transition-all text-xl">↺</button>
                                <button onClick={() => setCur(Math.max(0, cur-1))} className="text-gray-500 hover:text-white text-xl">⏮</button>
                                <button onClick={() => setPlaying(!playing)} className={`w-12 h-12 rounded-full flex items-center justify-center shadow-lg transition-all ${playing?'bg-red-500 hover:bg-red-600' : 'bg-blue-600 hover:bg-blue-700 active:scale-95 shadow-[0_0_10px_rgba(0,122,204,0.4)]'}`}>
                                    {playing?'⏸':'▶'}
                                </button>
                                <button onClick={() => setCur(Math.min(steps.length-1, cur+1))} className="text-gray-500 hover:text-white text-xl">⏭</button>
                            </div>
                            <div className="flex-1">
                                <div className="flex justify-between text-[10px] text-gray-500 mb-2 font-mono uppercase font-bold">
                                    <span>Rotting Process</span>
                                    <span>{cur + 1} / {steps.length} Steps</span>
                                </div>
                                <div className="h-1 w-full bg-black rounded-full overflow-hidden border border-white/5">
                                    <div className="h-full bg-blue-500 transition-all duration-300" style={{ width: `${((cur+1)/steps.length)*100}%` }}></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* RIGHT PANEL */}
                    <div className="w-[30%] bg-[#1E1E1E] border-l border-[#3C3C3C] flex flex-col relative overflow-hidden">
                        <div className="h-10 bg-[#252526] border-b border-[#3C3C3C] flex items-center px-4 font-mono text-[10px] text-gray-500 uppercase tracking-widest">
                            Solution.py — Multi-source BFS
                        </div>
                        <div className="flex-1 overflow-y-auto custom-scroll p-4 bg-[#1E1E1E]">
                            {CODE_SNIPPET.map((line, i) => (
                                <div key={i} className={`flex min-h-[1.4rem] items-center ${s.line === i ? 'active-line' : ''}`}>
                                    <span className="w-8 text-right pr-4 text-gray-700 text-[10px] font-mono select-none">{i+1}</span>
                                    <pre className="text-[11.5px] code-font" style={{ marginLeft: `${line.i * 1.5}rem` }} 
                                         dangerouslySetInnerHTML={{ __html: highlight(line.t) }} />
                                </div>
                            ))}
                        </div>
                        
                        {/* 變數監控 (Watcher) - 置底固定 */}
                        <div className="h-[40%] bg-[#252526] border-t border-[#3C3C3C] p-6 shadow-inner flex flex-col relative">
                            <h3 className="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-4 flex justify-between items-center">
                                <span>Debug Watcher</span>
                                <div className="flex gap-1 items-center code-font text-[9px] text-orange-400 bg-orange-500/10 px-2 py-0.5 rounded border border-orange-500/20">
                                    <span>R:{GRID_INIT.length}, C:{GRID_INIT[0].length}</span>
                                </div>
                            </h3>
                            <div className="space-y-3 font-mono text-[12px] flex-shrink-0">
                                <div className="flex justify-between border-b border-white/5 pb-1">
                                    <span className="text-gray-500">grid_ptr:</span>
                                    <span className="text-orange-400 font-bold">{s.r !== null ? `(${s.r}, ${s.c})` : 'None'}</span>
                                </div>
                                <div className="flex justify-between border-b border-white/5 pb-1">
                                    <span className="text-gray-500">fresh_orange_count:</span>
                                    <span className="text-green-400 font-bold">{s.freshCount}</span>
                                </div>
                            </div>
                            
                            {/* 動態 Queue 視覺化 */}
                            <div className="mt-4 flex-1 flex flex-col overflow-hidden relative">
                                <div className="text-[10px] text-gray-600 block mb-2 font-bold uppercase tracking-wider">Queue: collection.deque()</div>
                                <div className="flex-1 overflow-x-auto custom-scroll flex items-start gap-2 pb-2">
                                    {s.qSnap.length === 0 ? (
                                        <div className="w-full text-center text-gray-700 font-mono text-xs italic py-4">Queue is empty</div>
                                    ) : (
                                        s.qSnap.map((item, idx) => (
                                            <div key={`${cur}-${idx}`} className="queue-item flex-shrink-0 h-14 w-14 bg-[#1E1E1E] border border-orange-500/30 rounded-md flex flex-col items-center justify-center shadow-lg animate-pop">
                                                <span className="text-[11px] text-orange-400 font-mono font-bold">{item[0]},{item[1]}</span>
                                                <div className="w-3 h-0.5 bg-orange-500/50 mt-1"></div>
                                            </div>
                                        ))
                                    )}
                                </div>
                                <div className="absolute right-0 top-0 bottom-0 w-8 bg-gradient-to-l from-[#252526] to-transparent pointer-events-none"></div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
