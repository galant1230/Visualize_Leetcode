<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>LC#25 Hyper-Debugger: 繁體中文 VS Code 版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        :root {
            --bg-dark: #0d1117; --bg-sidebar: #161b22; --bg-panel: #21262d;
            --vscode-blue: #007acc; --syntax-kw: #c678dd; --syntax-fn: #61afef;
            --syntax-var: #e06c75; --syntax-num: #d19a66; --syntax-cm: #5c6370;
            --text-main: #adbac7;
        }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'JetBrains Mono', 'PingFang TC', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .main-layout { display: grid; grid-template-columns: 25% 45% 30%; height: calc(100vh - 120px); gap: 1px; background: #30363d; }
        .panel { background-color: var(--bg-sidebar); display: flex; flex-direction: column; overflow: hidden; }
        .node { width: 52px; height: 52px; border: 2px solid #444c56; display: flex; align-items: center; justify-content: center; position: relative; background: #2d333b; border-radius: 8px; font-weight: bold; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .node.active-group { border-color: var(--vscode-blue); box-shadow: 0 0 15px rgba(0, 122, 204, 0.4); }
        .arrow { width: 25px; height: 2px; background: #444c56; position: relative; }
        .ptr { position: absolute; font-size: 9px; font-weight: 800; padding: 2px 5px; border-radius: 4px; transform: translateX(-50%); left: 50%; white-space: nowrap; transition: all 0.3s ease; }
        .code-container { background-color: #1e1e1e; font-size: 13px; line-height: 1.6; flex: 1; overflow-y: auto; padding: 15px 0; }
        .line { display: flex; padding: 0 20px; border-left: 3px solid transparent; }
        .active-line { background: rgba(0, 122, 204, 0.2); border-left-color: var(--vscode-blue); }
        .line-num { width: 30px; color: #6e7681; text-align: right; margin-right: 20px; font-size: 11px; }
        .test-case-btn { background: #21262d; border: 1px solid #30363d; padding: 5px 12px; border-radius: 6px; font-size: 11px; transition: 0.2s; color: #8b949e; }
        .test-case-btn.active { background: #30363d; border-color: var(--vscode-blue); color: white; }
    </style>
</head>
<body>

<header class="h-[40px] bg-[#161b22] flex items-center px-4 justify-between border-b border-[#30363d]">
    <div class="flex items-center gap-3">
        <div class="flex gap-1.5"><div class="w-3 h-3 rounded-full bg-[#ff5f56]"></div><div class="w-3 h-3 rounded-full bg-[#ffbd2e]"></div><div class="w-3 h-3 rounded-full bg-[#27c93f]"></div></div>
        <span class="ml-4 text-[11px] font-bold text-gray-400">除錯工作階段: reverse_k_group.py</span>
    </div>
    <div id="finish-tag" class="hidden bg-green-600 text-white text-[10px] px-3 py-1 rounded font-bold uppercase">執行完畢</div>
</header>

<div class="main-layout">
    <aside class="panel border-r border-[#30363d]">
        <div class="p-5 space-y-6 overflow-y-auto">
            <div>
                <h2 class="text-white font-bold text-lg mb-2">#25. K 個一組翻轉鏈表</h2>
                <p class="text-xs leading-relaxed text-gray-400">
                    給你一個鏈表，每 <span class="text-white font-bold">k</span> 個節點一組進行翻轉，請回傳翻轉後的鏈表。如果節點總數不是 k 的整數倍，最後剩餘節點保持原順序。
                </p>
            </div>
            <div class="space-y-3 pt-4 border-t border-[#30363d]">
                <h3 class="text-[10px] uppercase font-black text-gray-500">複雜度分析</h3>
                <div class="flex gap-2">
                    <span class="bg-[#238636] text-white px-2 py-0.5 rounded-full text-[10px] font-bold">時間: O(N)</span>
                    <span class="bg-[#238636] text-white px-2 py-0.5 rounded-full text-[10px] font-bold">空間: O(1)</span>
                </div>
            </div>
            <div class="space-y-3 pt-4 border-t border-[#30363d]">
                <h3 class="text-[10px] uppercase font-black text-gray-500">測試資料設定</h3>
                <div class="flex flex-wrap gap-2">
                    <button class="test-case-btn active" onclick="setCase([1,2,3,4,5], 2)">範例 1 (K=2)</button>
                    <button class="test-case-btn" onclick="setCase([1,2,3,4,5,6], 3)">範例 2 (K=3)</button>
                </div>
            </div>
        </div>
    </aside>

    <main class="panel bg-[#0d1117]">
        <div id="viz-canvas" class="flex-1 flex items-center justify-center p-6 overflow-x-auto"></div>
        <div class="grid grid-cols-3 gap-1 p-4 bg-[#161b22] border-t border-[#30363d]">
            <div class="p-2 border-l-2 border-purple-500 bg-[#0d1117]/50">
                <div class="text-[9px] text-gray-500">PREV 指標</div>
                <div id="w-prev" class="text-sm font-bold text-purple-400">--</div>
            </div>
            <div class="p-2 border-l-2 border-blue-500 bg-[#0d1117]/50">
                <div class="text-[9px] text-gray-500">CURR 指標</div>
                <div id="w-curr" class="text-sm font-bold text-blue-400">--</div>
            </div>
            <div class="p-2 border-l-2 border-green-500 bg-[#0d1117]/50">
                <div class="text-[9px] text-gray-500">目前計數 (COUNT)</div>
                <div id="w-count" class="text-sm font-bold text-green-400">--</div>
            </div>
        </div>
    </main>

    <aside class="panel bg-[#1e1e1e] border-l border-[#30363d]">
        <div class="h-10 bg-[#252526] flex items-center px-4 border-b border-[#0d1117] text-[10px] text-gray-400 font-bold">PYTHON 源代碼</div>
        <div id="code-viewer" class="code-container"></div>
        <div id="log-box" class="h-52 bg-[#0d1117] p-4 overflow-y-auto text-[10px] font-mono border-t border-[#30363d]"></div>
    </aside>
</div>

<footer class="h-20 bg-[#161b22] border-t border-[#30363d] flex flex-col">
    <div class="w-full h-1 bg-[#21262d]">
        <div id="progress-bar" class="h-full bg-blue-500 transition-all duration-300" style="width: 0%"></div>
    </div>
    <div class="flex-1 flex items-center justify-between px-8">
        <div class="flex items-center gap-6">
            <button onclick="initVM()" class="text-gray-500 hover:text-white transition-colors" title="重置">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
            <span id="step-counter" class="text-xs font-mono text-gray-500 tracking-tighter">STEP: 0</span>
        </div>

        <div class="flex items-center gap-4">
            <button onclick="stepBack()" class="px-4 py-2 text-[11px] font-bold text-gray-300 bg-[#21262d] border border-[#30363d] rounded hover:bg-[#30363d] active:scale-95 transition-all">上一步</button>
            
            <button id="play-btn" onclick="togglePlay()" class="px-6 py-2 text-[11px] font-bold text-white bg-green-700 rounded hover:bg-green-600 transition-all min-w-[120px] flex items-center justify-center gap-2">
                <span id="play-icon">▶</span> <span id="play-text">自動播放</span>
            </button>

            <button id="step-btn" onclick="runStep()" class="px-8 py-2 text-[11px] font-bold text-white bg-blue-600 rounded hover:bg-blue-500 shadow-lg active:scale-95 transition-all">下一步</button>
        </div>

        <div class="w-24 text-right">
            <span id="status-text" class="text-[10px] font-bold text-blue-400 uppercase">就緒</span>
        </div>
    </div>
</footer>

<script>
const pythonCode = [
    "class Solution:",
    "  def reverseOneGroup(self, prev, next_node):",
    "    last = prev.next",
    "    curr = last.next",
    "    while curr != next_node:",
    "      last.next = curr.next",
    "      curr.next = prev.next",
    "      prev.next = curr",
    "      curr = last.next",
    "    return last",
    "  def reverseKGroup(self, head, k):",
    "    dummy = ListNode(0, head)",
    "    prev, curr, count = dummy, head, 1",
    "    while curr:",
    "      if count % k == 0:",
    "        prev = self.reverseOneGroup(prev, curr.next)",
    "        curr = prev.next",
    "      else:",
    "        curr = curr.next",
    "      count += 1",
    "    return dummy.next"
];

function highlight(line) {
    return line.replace(/\b(class|def|while|if|else|return|self)\b/g, '<span style="color:var(--syntax-kw)">$1</span>')
               .replace(/\b(reverseOneGroup|reverseKGroup|ListNode)\b/g, '<span style="color:var(--syntax-fn)">$1</span>')
               .replace(/\b(head|k|dummy|prev|curr|count|last|next_node|next)\b/g, '<span style="color:var(--syntax-var)">$1</span>')
               .replace(/\b(\d+)\b/g, '<span style="color:var(--syntax-num)">$1</span>');
}

let vm = { pc: 11, k: 2, list: [1,2,3,4,5], original: [1,2,3,4,5], vars: { prev: 'D', curr: 1, count: 0 }, terminated: false, step: 0 };
let history = [];
let timer = null;

function setCase(arr, k) {
    vm.original = [...arr]; vm.list = [...arr]; vm.k = k;
    document.querySelectorAll('.test-case-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    initVM();
}

function initVM() {
    stopPlay();
    vm = { pc: 11, k: vm.k, list: [...vm.original], original: [...vm.original], vars: { prev: 'D', curr: vm.original[0], count: 1 }, terminated: false, step: 0 };
    history = [];
    document.getElementById('finish-tag').classList.add('hidden');
    document.getElementById('step-btn').disabled = false;
    document.getElementById('log-box').innerHTML = "";
    addLog(`系統重置。K = ${vm.k}，鏈表 = [${vm.list}]`);
    updateUI();
}

function updateUI() {
    renderCode();
    renderViz();
    updateWatcher();
    document.getElementById('step-counter').innerText = `STEP: ${vm.step}`;
    document.getElementById('status-text').innerText = vm.terminated ? "執行完畢" : "執行中";
    
    // 進度條估算
    const progress = vm.terminated ? 100 : Math.min((vm.step / 25) * 100, 95);
    document.getElementById('progress-bar').style.width = `${progress}%`;
}

function runStep() {
    if (vm.terminated) { stopPlay(); return; }
    
    // 存入歷史堆疊以便「上一步」回溯
    history.push(JSON.parse(JSON.stringify(vm)));
    vm.step++;

    const k = vm.k;
    const idx = vm.list.indexOf(vm.vars.curr);

    switch(vm.pc) {
        case 11: addLog("建立 Dummy 節點"); vm.pc = 12; break;
        case 12: 
            vm.vars.prev = 'D'; vm.vars.curr = vm.list[0]; vm.vars.count = 1;
            addLog(`初始化：prev=Dummy, curr=${vm.vars.curr}`);
            vm.pc = 13; break;
        case 13: 
            if (!vm.vars.curr || vm.vars.curr === 'None') {
                addLog("迴圈結束"); vm.pc = 20; 
            } else { vm.pc = 14; }
            break;
        case 14: vm.pc = (vm.vars.count % k === 0) ? 15 : 18; break;
        case 15:
            addLog(`達到 K=${k}，執行區間翻轉`);
            let start = Math.floor((vm.vars.count-1)/k) * k;
            let sub = vm.list.splice(start, k); sub.reverse();
            vm.list.splice(start, 0, ...sub);
            vm.vars.prev = sub[sub.length-1];
            vm.pc = 16; break;
        case 16:
            let nIdx = vm.list.indexOf(vm.vars.prev) + 1;
            vm.vars.curr = vm.list[nIdx] || 'None';
            vm.pc = 19; break;
        case 18:
            vm.vars.curr = vm.list[idx + 1] || 'None';
            vm.pc = 19; break;
        case 19:
            vm.vars.count++; vm.pc = 13; break;
        case 20:
            addLog("完成"); vm.terminated = true;
            document.getElementById('finish-tag').classList.remove('hidden');
            document.getElementById('step-btn').disabled = true;
            stopPlay();
            break;
    }
    updateUI();
}

function stepBack() {
    if (history.length > 0) {
        vm = history.pop();
        addLog("執行上一步");
        updateUI();
    }
}

function togglePlay() {
    if (timer) {
        stopPlay();
    } else {
        if (vm.terminated) initVM();
        timer = setInterval(runStep, 800);
        document.getElementById('play-text').innerText = "暫停播放";
        document.getElementById('play-icon').innerText = "⏸";
        document.getElementById('play-btn').classList.replace('bg-green-700', 'bg-yellow-600');
    }
}

function stopPlay() {
    clearInterval(timer);
    timer = null;
    document.getElementById('play-text').innerText = "自動播放";
    document.getElementById('play-icon').innerText = "▶";
    document.getElementById('play-btn').classList.replace('bg-yellow-600', 'bg-green-700');
}

function renderCode() {
    const box = document.getElementById('code-viewer');
    box.innerHTML = pythonCode.map((t, i) => `
        <div class="line ${vm.pc === i ? 'active-line' : ''}"><span class="line-num">${i + 1}</span><span style="white-space:pre">${highlight(t)}</span></div>
    `).join('');
    const active = document.querySelector('.active-line');
    if(active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function renderViz() {
    const canvas = document.getElementById('viz-canvas');
    canvas.innerHTML = "";
    const isPD = vm.vars.prev === 'D';
    canvas.innerHTML += `
        <div class="flex items-center">
            <div class="node ${isPD ? 'active-group border-purple-500' : 'opacity-50'}">
                ${isPD ? '<span class="ptr text-purple-400" style="top:-30px">PREV</span>' : ''}
                <span class="text-xs text-gray-500">D</span>
            </div>
            <div class="arrow"></div>
        </div>
    `;
    vm.list.forEach((val, i) => {
        const isP = val === vm.vars.prev;
        const isC = val === vm.vars.curr;
        canvas.innerHTML += `
            <div class="flex items-center">
                <div class="node ${isC ? 'active-group border-blue-500' : ''} ${isP ? 'border-purple-500' : ''}">
                    ${isP ? '<span class="ptr text-purple-400" style="top:-30px">PREV</span>' : ''}
                    ${isC ? '<span class="ptr text-blue-400" style="top:-45px">CURR</span>' : ''}
                    <span class="text-sm">${val}</span>
                </div>
                ${i < vm.list.length - 1 ? '<div class="arrow"></div>' : '<div class="px-2 text-[10px] text-gray-600">NULL</div>'}
            </div>
        `;
    });
}

function updateWatcher() {
    document.getElementById('w-prev').innerText = vm.vars.prev;
    document.getElementById('w-curr').innerText = vm.vars.curr;
    document.getElementById('w-count').innerText = vm.vars.count;
}

function addLog(msg) {
    const box = document.getElementById('log-box');
    const div = document.createElement('div');
    div.className = "mb-1 text-gray-400 border-b border-[#21262d] pb-1";
    div.innerHTML = `<span class="text-blue-500 font-bold">信息</span> ${msg}`;
    box.prepend(div);
}

initVM();
</script>
</body>
</html>
